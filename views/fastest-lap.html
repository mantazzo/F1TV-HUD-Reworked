<!DOCTYPE html>
<html>
<head>
    <title>F1 Fastest Lap Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-fastest-lap.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="fastest-lap-container">
        <!-- Background -->
        <div class="fl-background"></div>

        <!-- Stripe container with background images -->
        <div class="fl-stripe">
            <div class="fl-bg-image"></div>
            <div class="fl-bg-gradient-1"></div>
            <div class="fl-bg-gradient-2"></div>
            <div class="fl-bg-gradient-3"></div>
            <div class="fl-bg-gradient-4"></div>
            <div class="fl-bg-gradient-5"></div>
        </div>

        <!-- Main content -->
        <div class="fl-content">
            <!-- Left section: FASTEST LAP text -->
            <div class="fl-label-fastest">FASTEST</div>
            <div class="fl-label-lap">LAP</div>

            <!-- Middle section: Driver name (colored with team color) -->
            <div class="fl-driver-name">VERSTAPPEN</div>

            <!-- Right section: Lap time -->
            <div class="fl-time-section">
                <div class="fl-lap-time">1:34.567</div>
            </div>
        </div>
    </div>

    <!-- Stroke element (line above the main container) -->
    <div class="stroke-container">
        <div class="stroke-background"></div>
        <div class="stroke-diagonal-bar"></div>
        <div class="stroke-border-blur"></div>
        <div class="stroke-gradient-1"></div>
        <div class="stroke-gradient-2"></div>
    </div>

    <script>
        const socket = io();
        socket.emit('identify', 'Fastest Lap');
        const flContainer = document.querySelector('.fastest-lap-container');
        const strokeContainer = document.querySelector('.stroke-container');
        const flStripe = document.querySelector('.fl-stripe');
        const flDriverName = document.querySelector('.fl-driver-name');
        const flLapTime = document.querySelector('.fl-lap-time');

        let participants = []; // Store full participant data
        let participantNames = {};
        let participantTeams = {};
        let participantPrimaryColors = {};
        let teamNames = {};
        let customDrivers = [];
        let aiDrivers = {};
        let eventCodes = {};
        let formulaType = DriverUtils.FORMULA_TYPE.F1_MODERN;
        let isAnimating = false;
        let hideTimeout = null;
        let hideCompleteTimeout = null;
        let queuedFastestLap = null;
        let safetyCarActive = false;     // m_safetyCarStatus is 1 (full SC) or 2 (VSC)
        let safetyCarDeployedAt = -Infinity;

        // Animation constants (the transitions themselves live in styles-fastest-lap.css)
        const ANIMATION_DURATION = {
            SLIDE: 333,        // container open/close (matches the CSS transition)
            DISPLAY: 8000,     // SimHub: changed(8000, fastest lap time)
            SC_SUPPRESS: 6000  // SimHub: hidden for 6s after a Safety Car / VSC is deployed
        };

        socket.on('drivers_data', (data) => {
            aiDrivers = data;
            console.log('AI drivers updated from server:', aiDrivers);
        });

        socket.on('event_codes', (data) => {
            eventCodes = data;
            console.log('Event codes received:', eventCodes);
        });

        // Load driver data using DriverUtils
        async function loadDriverData() {
            try {
                const data = await DriverUtils.loadDriverData(formulaType);
                customDrivers = data.customDrivers;
                teamNames = data.teamNames;
                console.log('[FastestLap] Loaded driver data:', customDrivers.length, 'custom drivers');
            } catch (error) {
                console.error('[FastestLap] Error loading driver data:', error);
                teamNames = {};
                customDrivers = [];
            }
        }

        // m:ss.fff, or ss.fff under a minute (SimHub: if(time > 59.999, secondstotimespan(time), time))
        function formatLapTime(milliseconds) {
            const minutes = Math.floor(milliseconds / 60000);
            const seconds = Math.floor((milliseconds % 60000) / 1000);
            const ms = String(milliseconds % 1000).padStart(3, '0');
            return minutes > 0
                ? `${minutes}:${String(seconds).padStart(2, '0')}.${ms}`
                : `${seconds}.${ms}`;
        }

        function getTeamColor(teamId, vehicleIdx) {
            const teamData = teamNames[teamId];

            // Priority 1: Override color from team data
            if (teamData && teamData.OverridePrimaryColor) {
                return teamData.OverridePrimaryColor;
            }

            // Priority 2: Livery color from game (stored in participantPrimaryColors)
            if (vehicleIdx !== undefined && participantPrimaryColors[vehicleIdx]) {
                return participantPrimaryColors[vehicleIdx];
            }

            // Fallback: Default team color or white
            if (teamData && teamData.Color) {
                return teamData.Color;
            }

            return 'rgb(255, 255, 255)';
        }

        // Update driver name styling with textFit
        function updateDriverNameStyling(name) {
            const nameLength = name.length;

            // Apply font-weight and font-stretch based on name length
            if (nameLength <= 10) {
                flDriverName.style.fontWeight = '700';
                flDriverName.style.fontStretch = 'normal';
            } else {
                flDriverName.style.fontWeight = '400';
                flDriverName.style.fontStretch = 'condensed';
            }

            // Use textFit to auto-resize font to fit container
            textFit(flDriverName, {
                minFontSize: 28,
                maxFontSize: 42,
                multiLine: false,
                detectMultiLine: false,
                alignHoriz: true,
                alignVert: false,
                widthOnly: true
            });
        }

        // Immediately trigger hide animation; a queued lap (if any) is shown once it's closed
        function hideOverlay() {
            // Clear any scheduled hide
            clearTimeout(hideTimeout);
            hideTimeout = null;
            clearTimeout(hideCompleteTimeout);

            // Animate out (CSS transitions back to the collapsed state)
            flContainer.classList.remove('is-shown');
            strokeContainer.classList.remove('is-shown');

            hideCompleteTimeout = setTimeout(() => {
                hideCompleteTimeout = null;
                isAnimating = false;

                // Reset the arrows only once the container is closed, so they don't jump back mid-close
                flStripe.classList.remove('is-armed');
                flLapTime.classList.remove('is-blinking');

                // Show the queued fastest lap, if one arrived while showing/closing
                if (queuedFastestLap) {
                    const queued = queuedFastestLap;
                    queuedFastestLap = null;
                    showFastestLapNotification(queued.driverName, queued.lapTime, queued.teamId, queued.vehicleIdx);
                }
            }, ANIMATION_DURATION.SLIDE);
        }

        function showFastestLapNotification(driverName, lapTime, teamId, vehicleIdx) {
            // If already animating, queue this lap and trigger immediate hide
            if (isAnimating) {
                queuedFastestLap = { driverName, lapTime, teamId, vehicleIdx };
                if (!hideCompleteTimeout) hideOverlay(); // already closing → it'll pick up the queued lap
                return;
            }

            isAnimating = true;

            console.log(`Fastest Lap: ${driverName} - ${formatLapTime(lapTime)} - Team ${teamId}`);

            // Update content
            flDriverName.textContent = driverName.toUpperCase();
            flDriverName.style.color = getTeamColor(teamId, vehicleIdx);
            flLapTime.textContent = formatLapTime(lapTime);
            updateDriverNameStyling(driverName.toUpperCase());

            // Animate in: left 460px→0, width 0→920px, plus the arrow slides and the lap time blink.
            // Reflow first so the transitions/animation restart from the collapsed state.
            void flContainer.offsetWidth;
            flContainer.classList.add('is-shown');
            strokeContainer.classList.add('is-shown');
            flStripe.classList.add('is-armed');
            flLapTime.classList.add('is-blinking');

            // Schedule hide after display duration
            hideTimeout = setTimeout(() => {
                hideOverlay();
            }, ANIMATION_DURATION.DISPLAY);
        }

        socket.on('f1_data', (data) => {
            const packetId = data.m_header.m_packetId;

            if (packetId === 1) {
                // Session packet - update formula type
                if (typeof data.m_formula === 'number' && data.m_formula !== formulaType) {
                    formulaType = data.m_formula;
                    console.log('[FastestLap] Formula type:', formulaType);
                    loadDriverData();
                }

                // SimHub Visible: hidden for 6s after a Safety Car / VSC is deployed
                // (isincreasing(6000, m_safetyCarStatus > 0 and < 3)) — e.g. an SC early in the race
                const scActive = data.m_safetyCarStatus === 1 || data.m_safetyCarStatus === 2;
                if (scActive && !safetyCarActive) {
                    safetyCarDeployedAt = Date.now();
                    queuedFastestLap = null;
                    if (isAnimating && !hideCompleteTimeout) hideOverlay();
                }
                safetyCarActive = scActive;
            } else if (packetId === 3) {
                // Event packet - check for fastest lap event
                const eventCode = data.m_eventStringCode;

                if (eventCode === eventCodes.FastestLap) {
                    if (Date.now() - safetyCarDeployedAt < ANIMATION_DURATION.SC_SUPPRESS) {
                        console.log('[FastestLap] Suppressed - Safety Car / VSC just deployed');
                        return;
                    }

                    // Fastest Lap event triggered
                    const vehicleIdx = data.m_eventDetails.vehicleIdx;
                    const lapTimeSeconds = data.m_eventDetails.lapTime;
                    const lapTimeMS = Math.round(lapTimeSeconds * 1000);

                    // Get driver name and team from stored participant data
                    const driverName = participantNames[vehicleIdx] || 'UNKNOWN';
                    const teamId = vehicleIdx in participantTeams ? participantTeams[vehicleIdx] : 255;

                    // Show notification
                    showFastestLapNotification(driverName, lapTimeMS, teamId, vehicleIdx);
                }
            } else if (packetId === 4) {
                // Participants packet - update driver names and team IDs using DriverUtils
                participants = data.m_participants || [];
                participantNames = {};
                participantTeams = {};
                participantPrimaryColors = {};

                participants.forEach((participant, i) => {
                    const index = i; // m_participantIndex doesn't exist in the current parser output; array index is the real car index
                    const teamId = participant.m_teamId;

                    // Store team ID
                    participantTeams[index] = teamId;

                    // Store primary livery color
                    if (participant.m_liveryColour && Array.isArray(participant.m_liveryColour) && participant.m_liveryColour.length > 0) {
                        const liveryColor = participant.m_liveryColour[0];
                        if (liveryColor && typeof liveryColor.red === 'number' && typeof liveryColor.green === 'number' && typeof liveryColor.blue === 'number') {
                            participantPrimaryColors[index] = `rgb(${liveryColor.red}, ${liveryColor.green}, ${liveryColor.blue})`;
                        }
                    }

                    // Get driver name using DriverUtils
                    const driverName = DriverUtils.getDriverLastName(
                        participant,
                        aiDrivers,
                        customDrivers,
                        teamNames
                    );
                    participantNames[index] = driverName.toUpperCase();
                });
            }
        });

        // Initialize
        loadDriverData();
    </script>
</body>
</html>
