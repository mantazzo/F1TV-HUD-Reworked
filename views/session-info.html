<!DOCTYPE html>
<html>
<head>
    <title>F1 Session Info Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-session-info.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="session-info-container">
        <div class="stroke"></div>
        <div class="background-pattern">
            <div class="bg-image bg-image-1"></div>
            <div class="bg-image bg-image-2"></div>
        </div>
        <div class="gradient-overlay"></div>
        <div class="track-flag" id="track-flag"></div>
        <div class="event-name" id="event-name">WAITING FOR TRACK DATA...</div>
        <div class="session-year" id="session-year">2026</div>
        <div class="separator"></div>
        <div class="session-type" id="session-type">WAITING...</div>
        <div class="location" id="location">WAITING...</div>
    </div>
    
    <script>
        const socket = io();
        socket.emit('identify', 'Session Info');
        
        // DOM elements
        const sessionInfoContainer = document.querySelector('.session-info-container');
        const trackFlagElement = document.getElementById('track-flag');
        const eventNameElement = document.getElementById('event-name');
        const sessionYearElement = document.getElementById('session-year');
        const sessionTypeElement = document.getElementById('session-type');
        const locationElement = document.getElementById('location');
        
        // State variables
        let trackId = -1;
        let trackData = null;
        let trackKey = null;     // track + game year of the loaded/loading track file
        let isTrackLoading = false;
        let currentFormula = null;
        let currentSessionType = null;
        let currentYear = null;
        let playerCarIdx = -1;   // "active driver" — m_header.m_playerCarIndex, or m_spectatorCarIndex while spectating
        let isSpectating = 0;     // from Session packet m_isSpectating
        let spectatorCarIndex = 255; // from Session packet m_spectatorCarIndex
        let detectedEraYear = null; // 2024/2025/2026 from player's m_teamId, or null to fall back to gameYear
        let isSprintWeekend = false; // true when m_weekendStructure contains both session type 15 and 16
        let overlayVisible = false;
        let visibilityMode = 'toggle'; // 'toggle', 'automatic', 'controlled'
        let hideTimer = null;
        
        // Track name mapping (from TRACKS constant)
        const TRACKS = [
            'Melbourne', 'Paul_Ricard', 'Shanghai', 'Sakhir', 'Catalunya',
            'Monaco', 'Montreal', 'Silverstone', 'Hockenheim', 'Hungaroring',
            'Spa', 'Monza', 'Singapore', 'Suzuka', 'Abu_Dhabi',
            'Texas', 'Brazil', 'Austria', 'Sochi', 'Mexico',
            'Baku', 'Sakhir_Short', 'Silverstone_Short', 'Texas_Short', 'Suzuka_Short',
            'Hanoi', 'Zandvoort', 'Imola', 'Portimao', 'Jeddah',
            'Miami', 'Las_Vegas', 'Losail', '33', '34',
            '35', '36', '37', '38',
            'Silverstone_Reverse', 'Austria_Reverse', 'Zandvoort_Reverse', 'Madrid'
        ];
        
        // Session type name mapping
        const SESSION_TYPE_NAMES = {
            0: 'UNKNOWN',
            1: 'PRACTICE 1',
            2: 'PRACTICE 2',
            3: 'PRACTICE 3',
            4: 'PRACTICE (SHORT)',
            5: 'QUALIFYING 1',
            6: 'QUALIFYING 2',
            7: 'QUALIFYING 3',
            8: 'QUALIFYING (SHORT)',
            9: 'QUALIFYING (ONE SHOT)',
            10: 'SPRINT SHOOTOUT 1',
            11: 'SPRINT SHOOTOUT 2',
            12: 'SPRINT SHOOTOUT 3',
            13: 'SPRINT SHOOTOUT (SHORT)',
            14: 'SPRINT SHOOTOUT (ONE SHOT)',
            15: 'RACE',  // Sprint Race on a Sprint weekend (type 16 also present) - see getSessionTypeName()
            16: 'RACE',
            17: 'RACE',
            18: 'TIME TRIAL'
        };
        
        // Handle overlay visibility from controller. overlay_config is re-broadcast on every config
        // change, so only react to the switch or the mode actually changing.
        socket.on('overlay_config', (config) => {
            if (config.overlays && config.overlays['session-info']) {
                const newVisible = config.overlays['session-info'].visible === true;
                const newMode = config.overlays['session-info'].visibilityMode || 'toggle';
                if (newVisible === overlayVisible && newMode === visibilityMode) return;

                overlayVisible = newVisible;
                visibilityMode = newMode;
                
                // Clear any existing timer
                if (hideTimer) {
                    clearTimeout(hideTimer);
                    hideTimer = null;
                }
                
                if (visibilityMode === 'toggle') {
                    // Simple on/off toggle
                    if (overlayVisible) {
                        sessionInfoContainer.classList.add('visible');
                    } else {
                        sessionInfoContainer.classList.remove('visible');
                    }
                } else if (visibilityMode === 'automatic') {
                    // Show for 10 seconds when enabled
                    if (overlayVisible) {
                        sessionInfoContainer.classList.add('visible');
                        hideTimer = setTimeout(() => {
                            sessionInfoContainer.classList.remove('visible');
                        }, 10000);
                    } else {
                        sessionInfoContainer.classList.remove('visible');
                    }
                } else if (visibilityMode === 'controlled') {
                    // Controlled by SSTA event - don't show immediately
                    // Will be shown when SSTA event is received
                    sessionInfoContainer.classList.remove('visible');
                }
            }
        });
        
        // Load track data
        async function loadTrackData(trackId, year = null) {
            const trackName = TRACKS[trackId];
            if (!trackName) {
                console.log(`Session Info: Invalid track ID ${trackId}`);
                return null;
            }
            
            // Try year-specific file first, then generic
            const filenames = [];
            if (year) {
                filenames.push(`/data/tracks/${year}-${trackId}-${trackName}.json`);
            }
            filenames.push(`/data/tracks/${trackId}-${trackName}.json`);
            
            for (const filename of filenames) {
                try {
                    const response = await fetch(filename);
                    if (response.ok) {
                        const data = await response.json();
                        console.log(`Session Info: Loaded track data from ${filename}`);
                        return data;
                    }
                } catch (err) {
                    // Silently continue to next file
                }
            }
            
            console.log(`Session Info: No track data found for ${trackName}`);
            return null;
        }
        
        // Get event name based on formula type, preferring an era-specific override
        // (e.g. "eventName_2026") when the player's car era is known
        function getEventName(trackData, formulaType, eraYear) {
            if (!trackData) {
                return formulaType === DriverUtils.FORMULA_TYPE.F2
                    ? '<F2 EVENT NAME MISSING>'
                    : '<F1 EVENT NAME MISSING>';
            }

            // For F2, try eventName_F2_<era> then eventName_F2, fallback to eventName
            if (formulaType === DriverUtils.FORMULA_TYPE.F2) {
                if (eraYear && trackData[`eventName_F2_${eraYear}`]) {
                    return trackData[`eventName_F2_${eraYear}`];
                }
                return trackData.eventName_F2 || trackData.eventName || '<F2 EVENT NAME MISSING>';
            }

            // For F1 and others, try eventName_<era> first (e.g. different 2026 sponsor)
            if (eraYear && trackData[`eventName_${eraYear}`]) {
                return trackData[`eventName_${eraYear}`];
            }
            return trackData.eventName || '<F1 EVENT NAME MISSING>';
        }
        
        // Get location from track data
        function getLocation(trackData) {
            if (!trackData || !trackData.location) {
                return '<LOCATION MISSING>';
            }
            return trackData.location.toUpperCase();
        }
        
        // Get year to display
        function getDisplayYear(gameYear, eraYear) {
            // Follows the cars: era-specific teams give their year, the generic team IDs (null here)
            // are reused across games, so those use the game year
            if (eraYear !== null && eraYear !== undefined) {
                return eraYear;
            }

            return DriverUtils.getFullGameYear(gameYear);
        }
        
        // Get session type name
        function getSessionTypeName(sessionType) {
            // On a Sprint weekend, session type 15 is the Sprint Race (16 is the Main Race);
            // on a normal weekend, 15 is the only race and stays "RACE".
            if (sessionType === 15 && isSprintWeekend) {
                return 'SPRINT RACE';
            }
            // F2 weekends: 16 is the Feature Race
            if (sessionType === 16 && currentFormula === DriverUtils.FORMULA_TYPE.F2) {
                return 'FEATURE RACE';
            }
            return SESSION_TYPE_NAMES[sessionType] || 'UNKNOWN';
        }
        
        // Set a text and refit it only when it actually changes
        function setFittedText(el, text, minFontSize, maxFontSize) {
            if (el.dataset.fitted === text) return;
            el.dataset.fitted = text;
            el.textContent = text;
            textFit(el, {
                minFontSize,
                maxFontSize,
                multiLine: false,
                detectMultiLine: false,
                alignHoriz: true,
                alignVert: false,
                widthOnly: true
            });
        }

        // Event name uses the whole box and may wrap, shrinking only when it doesn't fit. SimHub's
        // per-track widths/sizes were tuned for older names, and users can set their own names.
        function setEventName(text) {
            if (eventNameElement.dataset.fitted === text) return;
            eventNameElement.dataset.fitted = text;
            eventNameElement.textContent = text;
            textFit(eventNameElement, {
                minFontSize: 16,
                maxFontSize: 25,
                multiLine: true,
                detectMultiLine: false,
                alignHoriz: false,
                alignVert: false,
                widthOnly: false
            });
        }
        
        // Update display
        function updateDisplay() {
            // Nothing to show until the track file has loaded (Session packets keep arriving meanwhile)
            if (trackKey === null || isTrackLoading) return;

            const eventName = getEventName(trackData, currentFormula, detectedEraYear);
            const location = getLocation(trackData);
            const year = getDisplayYear(currentYear, detectedEraYear);
            const sessionTypeName = getSessionTypeName(currentSessionType);
            
            setEventName(eventName);
            setFittedText(locationElement, location, 16, 22);
            setFittedText(sessionTypeElement, sessionTypeName, 20, 30);

            // Load track flag image
            if (trackId !== -1 && TRACKS[trackId]) {
                const trackName = TRACKS[trackId];
                trackFlagElement.style.backgroundImage = `url('/images/session-info/${trackId}-${trackName}.png')`;
            }
            
            if (year !== null) {
                sessionYearElement.textContent = year;
                sessionYearElement.style.display = '';
            } else {
                console.error('Session Info: No year available to display, is the game outputting the m_gameYear field in the header?');
                sessionYearElement.style.display = 'none';
            }
        }
        
        // Listen for telemetry data
        socket.on('f1_data', (data) => {
            // Session packet - load track data and get session info
            if (data.m_header && data.m_header.m_packetId === 1) {
                isSpectating      = data.m_isSpectating      ?? isSpectating;
                spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;

                const newTrackId = data.m_trackId;
                const gameYear = data.m_header.m_gameYear !== undefined ? data.m_header.m_gameYear : null;
                const sessionType = data.m_sessionType !== undefined ? data.m_sessionType : null;
                const formula = data.m_formula !== undefined ? data.m_formula : null;

                // Sprint weekend detection: m_weekendStructure lists every session type for the
                // whole weekend (length m_numSessionsInWeekend) using the same type enum as
                // m_sessionType. It contains both 15 (Sprint Race) and 16 (Main Race) only on
                // Sprint weekends; on normal weekends it only contains 15.
                if (Array.isArray(data.m_weekendStructure)) {
                    const numSessions = data.m_numSessionsInWeekend ?? data.m_weekendStructure.length;
                    const weekendStructure = data.m_weekendStructure.slice(0, numSessions);
                    isSprintWeekend = weekendStructure.includes(16);
                }

                // Update current values
                currentYear = gameYear;
                currentSessionType = sessionType;
                currentFormula = formula;
                
                // Load track data if the track (or game, for year-specific files) changed
                const newTrackKey = `${newTrackId}-${gameYear}`;
                if (newTrackKey !== trackKey) {
                    trackKey = newTrackKey;
                    trackId = newTrackId;
                    isTrackLoading = true;
                    loadTrackData(trackId, DriverUtils.getFullGameYear(gameYear)).then(data => {
                        if (newTrackKey !== trackKey) return; // ignore a stale load after a quick track change
                        trackData = data;
                        isTrackLoading = false;
                        updateDisplay();
                    });
                } else {
                    updateDisplay();
                }
            }
            
            // Participants packet - detect player's team ID to determine car era (2024/2025/2026)
            if (data.m_header && data.m_header.m_packetId === 4) {
                if (data.m_header.m_playerCarIndex !== undefined) {
                    playerCarIdx = DriverUtils.getActiveDriverIndex(data.m_header.m_playerCarIndex, isSpectating, spectatorCarIndex);
                }

                const participants = data.m_participants;
                if (Array.isArray(participants) && participants[playerCarIdx]) {
                    const teamId = participants[playerCarIdx].m_teamId;
                    const eraYear = DriverUtils.getCarEraYear(teamId);

                    if (eraYear !== detectedEraYear) {
                        detectedEraYear = eraYear;
                        updateDisplay();
                    }
                }
            }

            // Event packet - detect Session Started (SSTA) event
            if (data.m_header && data.m_header.m_packetId === 3) {
                // Check if this is a Session Started event
                if (data.m_eventStringCode === 'SSTA' || 
                    (data.m_eventStringCode && data.m_eventStringCode.toString() === 'SSTA')) {
                    
                    // Only show if overlay is enabled and in 'controlled' mode
                    if (overlayVisible && visibilityMode === 'controlled') {
                        // Clear any existing timer
                        if (hideTimer) {
                            clearTimeout(hideTimer);
                        }
                        
                        // Show overlay
                        sessionInfoContainer.classList.add('visible');
                        
                        // Hide after 10 seconds
                        hideTimer = setTimeout(() => {
                            sessionInfoContainer.classList.remove('visible');
                        }, 10000);
                    }
                }
            }
        });

        // The event name fit measures text, so redo it if a web font arrives after the first fit
        document.fonts.ready.then(() => {
            delete eventNameElement.dataset.fitted;
            updateDisplay();
        });
    </script>
</body>
</html>
