<!DOCTYPE html>
<html>
<head>
    <title>F1 Driver Comparison Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-driver-comparison.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <!--
        Driver Comparison (SimHub original: "F1TV - Driver Ahead & Behind").
        Modes (Controller): gap = "V1" interval, speed = "V2" speeds + DRS/OT (races only),
        laps = "V3" sector/lap table, last lap both completed or best laps (any session but TT).
    -->
    <div class="overlay-container" data-mode="gap" data-side="ahead">

        <!-- ===== Modes gap + speed (SimHub layer "[✓] 1&2") ===== -->
        <div class="dc-mode dc-duel" id="dc-duel">
            <div class="dc-abs dc-linebg dc-linebg--v1"></div>
            <div class="dc-abs dc-linebg dc-linebg--v2"></div>
            <div class="dc-abs dc-middle"></div>

            <!-- Left card = car ahead on track -->
            <div class="dc-abs dc-card dc-card--left" id="dc-card-left">
                <div class="dc-card__inner">
                    <div class="dc-abs dc-card__bg"></div>
                    <div class="dc-text dc-card__first"></div>
                    <div class="dc-text dc-card__last"></div>
                    <div class="dc-abs dc-card__pos-bg"></div>
                    <div class="dc-abs dc-card__knockout"></div>
                    <div class="dc-text dc-card__position"></div>
                    <div class="dc-text dc-card__team"></div>
                    <img class="dc-card__logo" alt="">
                </div>
            </div>

            <!-- Right card = car behind on track -->
            <div class="dc-abs dc-card dc-card--right" id="dc-card-right">
                <div class="dc-card__inner">
                    <div class="dc-abs dc-card__bg"></div>
                    <div class="dc-text dc-card__first"></div>
                    <div class="dc-text dc-card__last"></div>
                    <div class="dc-abs dc-card__pos-bg"></div>
                    <div class="dc-abs dc-card__knockout"></div>
                    <div class="dc-text dc-card__position"></div>
                    <div class="dc-text dc-card__team"></div>
                    <img class="dc-card__logo" alt="">
                </div>
            </div>

            <div class="dc-abs dc-f2blur"><div class="dc-f2blur__ellipse"></div></div>

            <div class="dc-abs dc-team-line dc-team-line--left" id="dc-line-left"></div>
            <div class="dc-abs dc-team-line dc-team-line--right" id="dc-line-right"></div>
            <div class="dc-abs dc-fade dc-fade--left"></div>
            <div class="dc-abs dc-fade dc-fade--right"></div>

            <!-- Mode gap: "(1)" -->
            <div class="dc-gap">
                <div class="dc-text dc-gap__value" id="dc-gap-value"></div>
                <div class="dc-text dc-gap__label">CURRENT GAP</div>
            </div>

            <!-- Mode speed: "(2)" -->
            <div class="dc-speed">
                <div class="dc-text dc-drs dc-drs--left" id="dc-drs-left" data-state="off">DRS</div>
                <div class="dc-text dc-drs dc-drs--right" id="dc-drs-right" data-state="off">DRS</div>
                <div class="dc-abs dc-speed__data">
                    <div class="dc-text dc-speed__unit dc-speed__unit--alt dc-speed__unit--l"></div>
                    <div class="dc-text dc-speed__unit dc-speed__unit--main dc-speed__unit--l"></div>
                    <div class="dc-text dc-speed__unit dc-speed__unit--main dc-speed__unit--r"></div>
                    <div class="dc-text dc-speed__unit dc-speed__unit--alt dc-speed__unit--r"></div>
                    <div class="dc-text dc-speed__alt dc-speed--l" id="dc-speed-alt-left"></div>
                    <div class="dc-text dc-speed__main dc-speed--l" id="dc-speed-main-left"></div>
                    <div class="dc-text dc-speed__main dc-speed--r" id="dc-speed-main-right"></div>
                    <div class="dc-text dc-speed__alt dc-speed--r" id="dc-speed-alt-right"></div>
                </div>
            </div>

            <div class="dc-abs dc-middle-gradient"></div>

            <!-- Rolex widget above the right card (hidden; not used by the gap/speed formulas) -->
            <div class="dc-abs dc-duel__rolex" id="dc-duel-rolex">
                <div class="dc-abs dc-rolex">
                    <img src="/images/other-logos/Rolex.png" alt="Rolex">
                </div>
            </div>

            <div class="dc-abs dc-duel__stroke dc-duel__stroke--v1">
                <div class="dc-stroke">
                    <div class="dc-stroke__fill"></div>
                    <div class="dc-stroke__bars"></div>
                    <div class="dc-stroke__shadow"></div>
                    <div class="dc-stroke__gradient"></div>
                    <div class="dc-stroke__gradient"></div>
                </div>
            </div>
            <div class="dc-abs dc-duel__stroke dc-duel__stroke--v2">
                <div class="dc-stroke">
                    <div class="dc-stroke__fill"></div>
                    <div class="dc-stroke__bars"></div>
                    <div class="dc-stroke__shadow"></div>
                    <div class="dc-stroke__gradient"></div>
                    <div class="dc-stroke__gradient"></div>
                </div>
            </div>
        </div>

        <!-- ===== Mode laps (SimHub widgets "DriverAhead3" / "DriverBehind3") ===== -->
        <div class="dc-mode dc-laps" id="dc-laps">
            <div class="dc-laps__inner">
                <div class="dc-abs dc-laps__bg"></div>
                <div class="dc-abs dc-laps__bg-bottom"></div>
                <div class="dc-abs dc-laps__line"></div>

                <div class="dc-text dc-laps__label dc-col--s1">SECTOR 1</div>
                <div class="dc-text dc-laps__label dc-col--s2">SECTOR 2</div>
                <div class="dc-text dc-laps__label dc-col--s3">SECTOR 3</div>
                <div class="dc-text dc-laps__label dc-col--lap" id="dc-lap-label">LAP 0</div>

                <!-- Rows: top = car ahead, bottom = car behind. Row type (time/delta) set by side. -->
                <div class="dc-row dc-row--top" id="dc-row-top">
                    <div class="dc-abs dc-row__knockout"></div>
                    <div class="dc-text dc-row__position"></div>
                    <img class="dc-row__logo" alt="">
                    <div class="dc-text dc-row__name"></div>
                    <div class="dc-text dc-cell dc-col--s1"></div>
                    <div class="dc-text dc-cell dc-col--s2"></div>
                    <div class="dc-text dc-cell dc-col--s3"></div>
                    <div class="dc-text dc-cell dc-col--lap"></div>
                    <div class="dc-text dc-faster dc-col--s1">FASTER</div>
                    <div class="dc-text dc-faster dc-col--s2">FASTER</div>
                    <div class="dc-text dc-faster dc-col--s3">FASTER</div>
                    <div class="dc-text dc-faster dc-col--lap">FASTER</div>
                    <div class="dc-text dc-row__compound"></div>
                </div>
                <div class="dc-row dc-row--bottom" id="dc-row-bottom">
                    <div class="dc-abs dc-row__knockout"></div>
                    <div class="dc-text dc-row__position"></div>
                    <img class="dc-row__logo" alt="">
                    <div class="dc-text dc-row__name"></div>
                    <div class="dc-text dc-cell dc-col--s1"></div>
                    <div class="dc-text dc-cell dc-col--s2"></div>
                    <div class="dc-text dc-cell dc-col--s3"></div>
                    <div class="dc-text dc-cell dc-col--lap"></div>
                    <div class="dc-text dc-faster dc-col--s1">FASTER</div>
                    <div class="dc-text dc-faster dc-col--s2">FASTER</div>
                    <div class="dc-text dc-faster dc-col--s3">FASTER</div>
                    <div class="dc-text dc-faster dc-col--lap">FASTER</div>
                    <div class="dc-text dc-row__compound"></div>
                </div>

                <div class="dc-abs dc-laps__sep dc-laps__sep--pos"></div>
                <div class="dc-abs dc-laps__sep dc-laps__sep--name"></div>
                <div class="dc-abs dc-laps__sep dc-laps__sep--s1"></div>
                <div class="dc-abs dc-laps__sep dc-laps__sep--s2"></div>
                <div class="dc-abs dc-laps__sep dc-laps__sep--s3"></div>
                <div class="dc-abs dc-laps__sep dc-laps__sep--lap"></div>

                <div class="dc-abs dc-laps__stroke">
                    <div class="dc-stroke">
                        <div class="dc-stroke__fill"></div>
                        <div class="dc-stroke__bars"></div>
                        <div class="dc-stroke__shadow"></div>
                        <div class="dc-stroke__gradient"></div>
                        <div class="dc-stroke__gradient"></div>
                    </div>
                </div>

                <div class="dc-abs dc-laps__edges">
                    <div class="dc-abs dc-laps__edge dc-laps__edge--left"></div>
                    <div class="dc-abs dc-laps__edge dc-laps__edge--right"></div>
                </div>

                <div class="dc-abs dc-rolex" id="dc-rolex">
                    <img src="/images/other-logos/Rolex.png" alt="Rolex">
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        socket.emit('identify', 'Driver Comparison');

        const NUM_CARS = 24;                       // UDP capacity (2026 format); older formats send 22
        const RACE_TYPES = new Set([15, 16, 17]);  // SimHub: m_sessionType > 12 - meant for races only
        const TIME_TRIAL = 18;                     // laps mode: no real opponents, only ghost slots
        const KMH_TO_MPH = 0.621371;
        const FADE_MS = 150;                       // .dc-duel opacity transition (1/7 s)
        const LAPS_MOVE_MS = 200;                  // laps widget collapse/expand (--dc-move)
        const LAPS_DATA_FADE_MS = 167;             // Last/Best Lap data crossfade (1/6 s)
        const FASTER_MS = 900;                     // "FASTER" covers after the laps view appears
        const ROLEX_MS = 4000;                     // Rolex box after the laps view appears

        // Visual compound -> letter + colour (Leaderboard palette)
        const TYRE_COMPOUND = {
            7:  { letter: 'I', color: '#31AF49' },  // Intermediate
            8:  { letter: 'W', color: '#0073AD' },  // Wet
            15: { letter: 'W', color: '#0073AD' },  // Wet (F2)
            16: { letter: 'S', color: '#EC1C24' },  // Soft
            17: { letter: 'M', color: '#FFD604' },  // Medium
            18: { letter: 'H', color: '#F0F0EC' },  // Hard
            19: { letter: 'SS', color: '#97528F' }, // Super Soft (F2)
            20: { letter: 'S', color: '#EC1C24' },  // Soft (F2)
            21: { letter: 'M', color: '#FFD604' },  // Medium (F2)
            22: { letter: 'H', color: '#F0F0EC' }   // Hard (F2)
        };

        const COLOR_DRS = 'rgb(0, 255, 0)';
        const COLOR_OVERTAKE = 'rgb(14, 172, 230)'; // same turquoise as Live Speed / Leaderboard
        const COLOR_FAST = 'rgb(255, 0, 0)';
        const COLOR_NORMAL = 'rgb(255, 255, 255)';

        const container = document.querySelector('.overlay-container');
        const duel = document.getElementById('dc-duel');
        const gapValue = document.getElementById('dc-gap-value');

        function cardElements(id) {
            const card = document.getElementById(id);
            return {
                card,
                first: card.querySelector('.dc-card__first'),
                last: card.querySelector('.dc-card__last'),
                position: card.querySelector('.dc-card__position'),
                team: card.querySelector('.dc-card__team'),
                logo: card.querySelector('.dc-card__logo')
            };
        }

        // Per screen side: card, team line, DRS label and the side's two speed values
        const sides = {
            left: {
                ...cardElements('dc-card-left'),
                line: document.getElementById('dc-line-left'),
                drs: document.getElementById('dc-drs-left'),
                speedMain: document.getElementById('dc-speed-main-left'),
                speedAlt: document.getElementById('dc-speed-alt-left')
            },
            right: {
                ...cardElements('dc-card-right'),
                line: document.getElementById('dc-line-right'),
                drs: document.getElementById('dc-drs-right'),
                speedMain: document.getElementById('dc-speed-main-right'),
                speedAlt: document.getElementById('dc-speed-alt-right')
            }
        };
        const unitLabels = {
            main: document.querySelectorAll('.dc-speed__unit--main'),
            alt: document.querySelectorAll('.dc-speed__unit--alt')
        };

        // Laps mode: top row = car ahead on track (pair.left), bottom row = car behind (pair.right)
        const laps = document.getElementById('dc-laps');
        const lapLabel = document.getElementById('dc-lap-label');
        const lapsRolex = document.getElementById('dc-rolex');
        const LAP_COLUMNS = ['s1', 's2', 's3', 'lap'];

        function rowElements(id) {
            const row = document.getElementById(id);
            return {
                row,
                position: row.querySelector('.dc-row__position'),
                logo: row.querySelector('.dc-row__logo'),
                name: row.querySelector('.dc-row__name'),
                compound: row.querySelector('.dc-row__compound'),
                cells: LAP_COLUMNS.map(c => row.querySelector(`.dc-cell.dc-col--${c}`)),
                faster: LAP_COLUMNS.map(c => row.querySelector(`.dc-faster.dc-col--${c}`))
            };
        }
        const rows = { left: rowElements('dc-row-top'), right: rowElements('dc-row-bottom') };

        // ── Config ─────────────────────────────────────────────────────────
        let configVisible = false;
        let mode = 'gap';        // 'gap' (V1) | 'speed' (V2) | 'laps' (V3)
        let side = 'ahead';      // compare with the car 'ahead' | 'behind'
        let unitsMode = 'automatic';
        let lapsCompare = 'last'; // laps mode: 'last' lap both completed | each driver's 'best' lap
        let showSponsors = true;
        let swapping = false;    // fading out before a side change
        let swapTimer = null;
        let lapsCompareTimer = null;
        let lapsShown = false;
        let fasterUntil = 0;     // "FASTER" covers shown until this time (ms)
        let fasterTimer = null;
        let rolexTimer = null;

        // ── Session / driver data ──────────────────────────────────────────
        let sessionType = 0;
        let formulaType = DriverUtils.FORMULA_TYPE.F1_MODERN;
        let gameUsesMph = false; // m_speedUnitsLeadPlayer 0 = MPH
        let isSpectating = 0;
        let spectatorCarIndex = 255;
        let rawPlayerIndex = -1;
        let participants = [];
        let participantsActiveCars = 0;
        let sessionUID = null;
        let driversData = {};
        let customDrivers = [];
        let teamNames = {};

        // Per car, by car index
        const cars = Array.from({ length: NUM_CARS }, () => ({
            position: 0, resultStatus: 0, deltaFrontMs: 0,
            speedKmh: 0, drs: 0, drsAllowed: 0,
            regs2026: false, otActive: 0, otAvailable: 0
        }));

        // Session History per car index: { laps, numLaps, stints } (laps mode)
        let history = {};

        // Car indices currently shown on each side (-1 = none)
        const shown = { left: -1, right: -1 };

        function setText(el, text) {
            if (el.textContent !== text) el.textContent = text;
        }

        // textFit wraps the text in a span; only re-fit when the text actually changed
        // (setting textContent drops the span, which forces the next fit)
        function setFittedText(el, text, maxFontSize) {
            if (el._fitText === text) return;
            el._fitText = text;
            el.textContent = text;
            if (!text) return;
            try {
                textFit(el, { minFontSize: 14, maxFontSize, multiLine: false, detectMultiLine: false, widthOnly: true });
            } catch (e) { /* element not laid out yet - text is still shown at full size */ }
        }

        async function loadDriverData() {
            const data = await DriverUtils.loadDriverData(formulaType);
            customDrivers = data.customDrivers;
            teamNames = data.teamNames;
            for (const s of ['left', 'right']) {
                sides[s].renderedKey = null;
                rows[s].renderedKey = null;
            }
            update();
        }

        // ── Who is compared ────────────────────────────────────────────────
        function activeIndex() {
            return DriverUtils.getActiveDriverIndex(rawPlayerIndex, isSpectating, spectatorCarIndex);
        }

        function carAtPosition(position) {
            if (position < 1) return -1;
            for (let i = 0; i < NUM_CARS; i++) {
                // Status 1 = MP placeholder slot that never leaves the garage
                if (cars[i].position === position && cars[i].resultStatus !== 1) return i;
            }
            return -1;
        }

        // Observed driver + opponent, mapped to screen sides (car ahead on track is always left).
        // Null when there's nobody to compare with: leading in "ahead", last in "behind", or the
        // car behind is out of the race (retired/DSQ cars are ranked at the back).
        function resolvePair() {
            const observed = activeIndex();
            if (observed < 0 || observed >= NUM_CARS) return null;
            const position = cars[observed].position;
            if (position < 1) return null;

            const opponent = carAtPosition(side === 'ahead' ? position - 1 : position + 1);
            if (opponent < 0) return null;
            const status = cars[opponent].resultStatus;
            if (mode === 'laps') {
                // Laps still compare against a retired/DSQ car (its row is dimmed instead)
                if (status < 2) return null;
            } else if (status !== 2 && status !== 3) {
                return null; // 2 = active, 3 = finished
            }

            return side === 'ahead'
                ? { left: opponent, right: observed, gapCar: observed }
                : { left: observed, right: opponent, gapCar: opponent };
        }

        let pair = null;

        function update() {
            pair = resolvePair();
            if (pair) {
                if (mode === 'laps') {
                    renderLapsRows();
                    renderLapsData();
                } else {
                    renderCards();
                    renderGap();
                    renderSpeeds();
                }
            }
            updateVisibility();
        }

        function updateVisibility() {
            const ready = configVisible && !swapping && pair !== null;
            duel.classList.toggle('is-shown', ready
                && RACE_TYPES.has(sessionType)
                && (mode === 'gap' || mode === 'speed'));

            // Laps: any session (SimHub has no session limit here) except Time Trial
            const showLaps = ready && mode === 'laps' && sessionType !== TIME_TRIAL;
            laps.classList.toggle('is-shown', showLaps);
            if (showLaps && !lapsShown) onLapsShown();
            if (!showLaps && lapsShown) onLapsHidden();
            lapsShown = showLaps;
        }

        // ── Cards ──────────────────────────────────────────────────────────
        function teamColor(carIdx) {
            const p = participants[carIdx];
            const override = teamNames?.[p?.m_teamId]?.OverridePrimaryColor;
            if (override) return override;
            const livery = p?.m_liveryColour?.[0];
            if (livery && typeof livery.red === 'number') {
                return `rgb(${livery.red}, ${livery.green}, ${livery.blue})`;
            }
            return COLOR_NORMAL;
        }

        function renderCards() {
            if (!pair) return;
            for (const s of ['left', 'right']) {
                const carIdx = pair[s];
                shown[s] = carIdx;
                renderCard(sides[s], carIdx);
            }
        }

        function renderCard(el, carIdx) {
            const p = participants[carIdx];
            setText(el.position, String(cars[carIdx].position));
            if (!p) return;

            // Names/team/logo only change with the car or a Participants update
            const key = `${carIdx}|${p.m_driverId}|${p.m_teamId}|${p.m_raceNumber}|${p.m_name}`;
            if (el.renderedKey === key) return;
            el.renderedKey = key;

            const color = teamColor(carIdx);
            el.card.style.setProperty('--dc-team-color', color);
            el.line.style.setProperty('--dc-team-color', color);

            const first = DriverUtils.getDriverFirstName(p, driversData, customDrivers, teamNames);
            const last = DriverUtils.getDriverLastName(p, driversData, customDrivers, teamNames);
            setFittedText(el.first, first.toUpperCase(), 27);
            setFittedText(el.last, last.toUpperCase(), 34);

            const teamData = teamNames?.[p.m_teamId];
            setText(el.team, (teamData?.ShortName || '').toUpperCase());

            // Knockout image: never in a race, kept for comparisons in timed sessions later
            el.card.classList.toggle('is-knockout',
                DriverUtils.isInKnockoutZone(cars[carIdx].position, sessionType, NUM_CARS));

            const logoUrl = teamData?.Logo ? `/images/team-logos/${teamData.Logo}` : '';
            if (el.logo.dataset.src !== logoUrl) {
                el.logo.dataset.src = logoUrl;
                el.logo.classList.remove('is-loaded');
                if (logoUrl) {
                    el.logo.onload = () => el.logo.classList.add('is-loaded');
                    el.logo.src = logoUrl;
                } else {
                    el.logo.removeAttribute('src');
                }
            }
        }

        // ── Mode gap (V1) ──────────────────────────────────────────────────
        // m_deltaToCarInFront MS part is a uint16: a negative delta wraps to ~65535
        // (the Leaderboard's "+1:05" flash), so anything >= 60000 is read as negative.
        function decodeDeltaMs(minutesPart, msPart) {
            const ms = msPart ?? 0;
            if (ms >= 60000) return ms - 65536;
            return (minutesPart ?? 0) * 60000 + ms;
        }

        // Always seconds, never minutes: +100.458S
        function formatGap(ms) {
            if (!(ms > 0)) return '+0.000S';
            return `+${Math.floor(ms / 1000)}.${String(ms % 1000).padStart(3, '0')}S`;
        }

        function renderGap() {
            if (!pair) return;
            setText(gapValue, formatGap(cars[pair.gapCar].deltaFrontMs));
        }

        // ── Mode speed (V2) ────────────────────────────────────────────────
        function mainIsMph() {
            return unitsMode === 'mph' || (unitsMode !== 'kmh' && gameUsesMph);
        }

        function renderUnits() {
            const mph = mainIsMph();
            container.classList.toggle('is-kmh', !mph);
            unitLabels.main.forEach(el => setText(el, mph ? 'MPH' : 'KM/H'));
            unitLabels.alt.forEach(el => setText(el, mph ? 'KM/H' : 'MPH'));
        }

        function boostState(car) {
            if (car.regs2026) {
                if (car.otActive === 1) return 'active';
                if (car.otAvailable === 1) return 'available';
                return 'off';
            }
            if (car.drs === 1) return 'active';
            if (car.drsAllowed === 1) return 'available';
            return 'off';
        }

        function renderSpeeds() {
            if (!pair) return;
            const mph = mainIsMph();
            for (const s of ['left', 'right']) {
                const el = sides[s];
                const car = cars[pair[s]];
                const kmh = Math.round(car.speedKmh);
                const mphValue = Math.round(car.speedKmh * KMH_TO_MPH);
                setText(el.speedMain, String(mph ? mphValue : kmh));
                setText(el.speedAlt, String(mph ? kmh : mphValue));

                const state = boostState(car);
                const color = state === 'active'
                    ? (car.regs2026 ? COLOR_OVERTAKE : COLOR_DRS)
                    : (kmh > 199 ? COLOR_FAST : COLOR_NORMAL);
                if (el.speedMain.style.color !== color) {
                    el.speedMain.style.color = color;
                    el.speedAlt.style.color = color;
                }

                if (el.drs.dataset.state !== state) el.drs.dataset.state = state;
                el.drs.classList.toggle('is-overtake', car.regs2026);
                setText(el.drs, car.regs2026 ? 'OT' : 'DRS');
            }
        }

        // ── Mode laps (V3) ─────────────────────────────────────────────────
        // m_numActiveCars drops when a driver retires - max-merge with the highest position
        function numActiveCars() {
            let maxPos = 0;
            for (const car of cars) {
                if (car.resultStatus !== 1 && car.position > maxPos) maxPos = car.position;
            }
            return Math.max(participantsActiveCars, maxPos);
        }

        function renderLapsRows() {
            for (const s of ['left', 'right']) {
                const el = rows[s];
                const carIdx = pair[s];
                const car = cars[carIdx];
                setText(el.position, String(car.position));
                el.row.classList.toggle('is-knockout',
                    DriverUtils.isInKnockoutZone(car.position, sessionType, numActiveCars()));
                // 4 = DNF, 5 = DSQ, 6 = not classified, 7 = retired
                el.row.classList.toggle('is-out', car.resultStatus >= 4);

                const p = participants[carIdx];
                if (!p) continue;
                const key = `${carIdx}|${p.m_driverId}|${p.m_teamId}|${p.m_raceNumber}|${p.m_name}`;
                if (el.renderedKey === key) continue;
                el.renderedKey = key;

                const last = DriverUtils.getDriverLastName(p, driversData, customDrivers, teamNames);
                setFittedText(el.name, last.toUpperCase(), 24);

                const teamData = teamNames?.[p.m_teamId];
                const logoUrl = teamData?.Logo ? `/images/team-logos/${teamData.Logo}` : '';
                if (el.logo.dataset.src !== logoUrl) {
                    el.logo.dataset.src = logoUrl;
                    el.logo.classList.remove('is-loaded');
                    if (logoUrl) {
                        el.logo.onload = () => el.logo.classList.add('is-loaded');
                        el.logo.src = logoUrl;
                    } else {
                        el.logo.removeAttribute('src');
                    }
                }
            }
        }

        // [S1, S2, S3, lap] of one Session History lap entry
        function entryTimes(entry) {
            return [
                entry.m_sector1TimeMinutesPart * 60000 + entry.m_sector1TimeMSPart,
                entry.m_sector2TimeMinutesPart * 60000 + entry.m_sector2TimeMSPart,
                entry.m_sector3TimeMinutesPart * 60000 + entry.m_sector3TimeMSPart,
                entry.m_lapTimeInMS
            ];
        }

        // Completed lap entry (lap number 1-based), or null. The current partial lap has no lap time.
        function lapEntry(carIdx, lapNum) {
            const h = history[carIdx];
            if (!h || lapNum < 1 || lapNum > h.numLaps) return null;
            const entry = h.laps[lapNum - 1];
            return entry && entry.m_lapTimeInMS > 0 ? entry : null;
        }

        function lastCompletedLap(carIdx) {
            const h = history[carIdx];
            if (!h) return 0;
            for (let n = h.numLaps; n >= 1; n--) {
                if (lapEntry(carIdx, n)) return n;
            }
            return 0;
        }

        // Fastest completed lap number (m_bestLapTimeLapNum isn't trusted - see Lap Timer)
        function bestLapNum(carIdx) {
            const h = history[carIdx];
            if (!h) return 0;
            let best = 0;
            let bestMs = Infinity;
            for (let n = 1; n <= h.numLaps; n++) {
                const ms = lapEntry(carIdx, n)?.m_lapTimeInMS;
                if (ms && ms < bestMs) { best = n; bestMs = ms; }
            }
            return best;
        }

        // Lap number per row: last mode = the last lap BOTH drivers completed (same number),
        // best mode = each driver's own best lap
        function comparedLaps() {
            const top = pair.left;
            const bottom = pair.right;
            if (lapsCompare === 'best') return { top: bestLapNum(top), bottom: bestLapNum(bottom) };
            let n = Math.min(lastCompletedLap(top), lastCompletedLap(bottom));
            while (n > 0 && !(lapEntry(top, n) && lapEntry(bottom, n))) n--;
            return { top: n, bottom: n };
        }

        // Under a minute "23.456", otherwise "1:23.456"
        function formatTime(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor((ms % 60000) / 1000);
            const millis = String(ms % 1000).padStart(3, '0');
            return minutes > 0
                ? `${minutes}:${String(seconds).padStart(2, '0')}.${millis}`
                : `${seconds}.${millis}`;
        }

        function compoundOnLap(carIdx, lapNum) {
            const h = history[carIdx];
            if (!h || lapNum < 1) return null;
            // m_endLap = lap the set was used until (255 = still fitted)
            const stint = h.stints.find(st => st.m_endLap >= lapNum);
            return stint ? TYRE_COMPOUND[stint.m_tyreVisualCompound] || null : null;
        }

        function setCell(cell, text, isDelta) {
            setText(cell, text);
            cell.classList.toggle('is-delta', isDelta);
        }

        // Per column the faster driver's cell shows the (negative) delta in lime, the slower
        // driver's cell their own time. Ties / a missing time: plain times only.
        function renderLapsData() {
            if (!pair) return;
            const lapNums = comparedLaps();
            setText(lapLabel, lapsCompare === 'best' ? 'BEST LAP' : `LAP ${lapNums.top}`);

            const topEntry = lapEntry(pair.left, lapNums.top);
            const bottomEntry = lapEntry(pair.right, lapNums.bottom);
            const top = topEntry ? entryTimes(topEntry) : [0, 0, 0, 0];
            const bottom = bottomEntry ? entryTimes(bottomEntry) : [0, 0, 0, 0];
            const fasterActive = Date.now() < fasterUntil;

            for (let c = 0; c < LAP_COLUMNS.length; c++) {
                const a = top[c];
                const b = bottom[c];
                const topFaster = a > 0 && b > 0 && a < b;
                const bottomFaster = a > 0 && b > 0 && b < a;

                if (topFaster) setCell(rows.left.cells[c], `-${formatTime(b - a)}`, true);
                else setCell(rows.left.cells[c], a > 0 ? formatTime(a) : '', false);

                if (bottomFaster) setCell(rows.right.cells[c], `-${formatTime(a - b)}`, true);
                else setCell(rows.right.cells[c], b > 0 ? formatTime(b) : '', false);

                rows.left.faster[c].classList.toggle('is-shown', fasterActive && topFaster);
                rows.right.faster[c].classList.toggle('is-shown', fasterActive && bottomFaster);
            }

            for (const [s, lapNum] of [['left', lapNums.top], ['right', lapNums.bottom]]) {
                const compound = (s === 'left' ? topEntry : bottomEntry) ? compoundOnLap(pair[s], lapNum) : null;
                const el = rows[s].compound;
                setText(el, compound ? compound.letter : '');
                if (compound && el.style.color !== compound.color) el.style.color = compound.color;
            }
        }

        // SimHub isincreasing(...) on the mode toggle: "FASTER" for 900ms, Rolex for 4s
        function onLapsShown() {
            fasterUntil = Date.now() + FASTER_MS;
            clearTimeout(fasterTimer);
            fasterTimer = setTimeout(renderLapsData, FASTER_MS);
            renderLapsData();

            clearTimeout(rolexTimer);
            lapsRolex.classList.toggle('is-shown', showSponsors);
            rolexTimer = setTimeout(() => lapsRolex.classList.remove('is-shown'), ROLEX_MS);
        }

        function onLapsHidden() {
            fasterUntil = 0;
            clearTimeout(fasterTimer);
            clearTimeout(rolexTimer);
            lapsRolex.classList.remove('is-shown');
            for (const s of ['left', 'right']) rows[s].faster.forEach(f => f.classList.remove('is-shown'));
        }

        // Last <-> Best: fade the data out, swap, fade back in
        function applyLapsCompare(newCompare) {
            newCompare = newCompare === 'best' ? 'best' : 'last';
            clearTimeout(lapsCompareTimer); // a quick toggle back cancels the pending swap
            if (newCompare === lapsCompare) {
                laps.classList.remove('is-data-hidden');
                return;
            }
            if (!lapsShown) {
                lapsCompare = newCompare;
                return;
            }
            laps.classList.add('is-data-hidden');
            lapsCompareTimer = setTimeout(() => {
                lapsCompare = newCompare;
                renderLapsData();
                laps.classList.remove('is-data-hidden');
            }, LAPS_DATA_FADE_MS);
        }

        // ── Config ─────────────────────────────────────────────────────────
        function applyMode(newMode) {
            mode = newMode === 'speed' || newMode === 'laps' ? newMode : 'gap';
            container.dataset.mode = mode;
        }

        // Side changes swap which cars the cards show, so fade out first, then swap and fade in
        function applySide(newSide) {
            newSide = newSide === 'behind' ? 'behind' : 'ahead';
            if (newSide === side && !swapping) return;
            clearTimeout(swapTimer);
            if (!duel.classList.contains('is-shown') && !lapsShown) {
                side = newSide;
                container.dataset.side = side;
                swapping = false;
                update();
                return;
            }
            swapping = true;
            updateVisibility();
            swapTimer = setTimeout(() => {
                side = newSide;
                container.dataset.side = side;
                swapping = false;
                update();
            }, lapsShown ? LAPS_MOVE_MS : FADE_MS);
        }

        socket.on('overlay_config', (config) => {
            const cfg = config?.overlays?.['driver-comparison'];
            if (!cfg) return;
            configVisible = !!cfg.visible;
            showSponsors = config?.global?.showSponsors !== false;
            if (!showSponsors) lapsRolex.classList.remove('is-shown');
            applyMode(cfg.mode);
            unitsMode = cfg.unitsMode || 'automatic';
            renderUnits();
            applyLapsCompare(cfg.lapsCompare);
            applySide(cfg.side);
            update();
        });

        socket.on('drivers_data', (drivers) => {
            driversData = drivers;
            for (const s of ['left', 'right']) {
                sides[s].renderedKey = null;
                rows[s].renderedKey = null;
            }
            update();
        });

        socket.on('f1_data', (data) => {
            const pid = data?.m_header?.m_packetId;
            const playerIdx = data?.m_header?.m_playerCarIndex;
            if (typeof playerIdx === 'number') rawPlayerIndex = playerIdx;

            // New session: drop the previous session's lap history
            const uid = data?.m_header?.m_sessionUID;
            if (uid !== undefined && String(uid) !== sessionUID) {
                sessionUID = String(uid);
                history = {};
            }

            if (pid === 1) { // Session
                isSpectating = data.m_isSpectating ?? isSpectating;
                spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;
                if (typeof data.m_sessionType === 'number') sessionType = data.m_sessionType;
                if (typeof data.m_speedUnitsLeadPlayer === 'number') {
                    const mph = data.m_speedUnitsLeadPlayer === 0;
                    if (mph !== gameUsesMph) {
                        gameUsesMph = mph;
                        renderUnits();
                        renderSpeeds();
                    }
                }
                if (typeof data.m_formula === 'number' && data.m_formula !== formulaType) {
                    formulaType = data.m_formula;
                    // F2 blur + navy fades. 7 = older games' F2 2021, kept for completeness.
                    container.classList.toggle('is-f2',
                        formulaType === DriverUtils.FORMULA_TYPE.F2 || formulaType === DriverUtils.FORMULA_TYPE.F2_2021);
                    loadDriverData();
                }
                updateVisibility();
            } else if (pid === 2) { // Lap Data
                const lapData = data.m_lapData;
                if (!Array.isArray(lapData)) return;
                lapData.forEach((lap, i) => {
                    if (i >= NUM_CARS) return;
                    cars[i].position = lap.m_carPosition ?? 0;
                    cars[i].resultStatus = lap.m_resultStatus ?? 0;
                    cars[i].deltaFrontMs = decodeDeltaMs(lap.m_deltaToCarInFrontMinutesPart, lap.m_deltaToCarInFrontMSPart);
                });
                update();
            } else if (pid === 4) { // Participants
                if (!Array.isArray(data.m_participants)) return;
                participants = data.m_participants;
                participantsActiveCars = data.m_numActiveCars ?? participantsActiveCars;
                update();
            } else if (pid === 11) { // Session History (one car per packet, cycling)
                const carIdx = data.m_carIdx;
                if (typeof carIdx !== 'number' || carIdx >= NUM_CARS) return;
                const lapHistory = data.m_lapHistoryData || [];
                history[carIdx] = {
                    laps: lapHistory,
                    numLaps: Math.min(data.m_numLaps || 0, lapHistory.length),
                    stints: (data.m_tyreStintsHistoryData || []).slice(0, data.m_numTyreStints || 0)
                };
                if (mode === 'laps' && pair && (carIdx === pair.left || carIdx === pair.right)) renderLapsData();
            } else if (pid === 6) { // Car Telemetry
                const telemetry = data.m_carTelemetryData;
                if (!Array.isArray(telemetry)) return;
                telemetry.forEach((t, i) => {
                    if (i >= NUM_CARS) return;
                    cars[i].speedKmh = t.m_speed ?? 0;
                    cars[i].drs = t.m_drs ?? 0;
                });
                if (mode === 'speed') renderSpeeds();
            } else if (pid === 7) { // Car Status
                const status = data.m_carStatusData;
                if (!Array.isArray(status)) return;
                status.forEach((s, i) => {
                    if (i >= NUM_CARS) return;
                    cars[i].drsAllowed = s.m_drsAllowed ?? 0;
                });
            } else if (pid === 16) { // Car Telemetry 2 (2026 Season Pack format only)
                const telemetry2 = data.m_carTelemetry2Data;
                if (!Array.isArray(telemetry2)) return;
                telemetry2.forEach((t2, i) => {
                    if (i >= NUM_CARS) return;
                    cars[i].regs2026 = t2.m_2026Regulations === 1;
                    cars[i].otActive = t2.m_overtakeActive ?? 0;
                    cars[i].otAvailable = t2.m_overtakeAvailable ?? 0;
                });
            }
        });

        renderUnits();
        loadDriverData();
    </script>
</body>
</html>
