<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>F1 Mini Leaderboard Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-mini-leaderboard.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="overlay-container">
        <!-- Sponsor -->
        <div class="sponsor">
            <div class="sponsor-rectangle"></div>
            <div class="sponsor-text-qatar">QATAR</div>
            <div class="sponsor-text-airways">AIRWAYS</div>
        </div>

        <!-- Leaderboard Container -->
        <div class="leaderboard-container">
            <!-- Background -->
            <div class="background">
                <!-- Main Rectangle -->
                <div class="background-rectangle-main"></div>
                <!-- Divider Rectangle -->
                <div class="background-rectangle-divider"></div>
                <!-- Decorations -->
                <img src="/images/mini-leaderboard/DecorationLeft.png" class="decoration-left" alt="">
                <img src="/images/mini-leaderboard/DecorationRight.png" class="decoration-right" alt="">
            </div>

            <!-- Driver rows - three identical slots; the observed driver's row gets .is-observed
                 (top row when P1, bottom row when last, middle otherwise) -->
            <div class="driver-row is-empty">
                <img src="/images/common/PlayerIndicator.png" class="player-indicator" alt="">
                <div class="driver-name"></div>
                <img src="/images/common/Knockout.png" class="knockout-overlay" alt="">
                <div class="position-number"></div>
                <div class="position-stroke"></div>
            </div>
            <div class="driver-row is-observed">
                <img src="/images/common/PlayerIndicator.png" class="player-indicator" alt="">
                <div class="driver-name">WAITING...</div>
                <img src="/images/common/Knockout.png" class="knockout-overlay" alt="">
                <div class="position-number">-</div>
                <div class="position-stroke"></div>
            </div>
            <div class="driver-row is-empty">
                <img src="/images/common/PlayerIndicator.png" class="player-indicator" alt="">
                <div class="driver-name"></div>
                <img src="/images/common/Knockout.png" class="knockout-overlay" alt="">
                <div class="position-number"></div>
                <div class="position-stroke"></div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        socket.emit('identify', 'Mini Leaderboard');
        
        // Element references
        const overlayContainer = document.querySelector('.overlay-container');
        const sponsorElement = document.querySelector('.sponsor');
        const rows = Array.from(document.querySelectorAll('.driver-row')).map(el => ({
            el,
            positionEl: el.querySelector('.position-number'),
            nameEl: el.querySelector('.driver-name')
        }));

        // SimHub row geometry: rows stack from top 10px, observed row 55px tall, others 50px
        const ROWS_TOP = 10;
        const ROW_HEIGHT = 50;
        const OBSERVED_ROW_HEIGHT = 55;
        
        // Sponsor display control
        let sponsorTimeout = null;
        let isOverlayVisible = false;
        let showSponsors = true; // global (all overlays): Qatar Airways logo
        
        // Data storage
        let aiDrivers = {};
        let customDrivers = [];
        let teamNames = {};
        let participants = []; // Store full participant data
        let participantLastNames = {};
        let playerIndex = null;  // "active driver" — m_header.m_playerCarIndex, or m_spectatorCarIndex while spectating
        let rawPlayerIndex = null; // from m_header.m_playerCarIndex, unmodified
        let isSpectating = 0;     // from Session packet m_isSpectating
        let spectatorCarIndex = 255; // from Session packet m_spectatorCarIndex
        let participantsActiveCars = 0; // latest m_numActiveCars (Participants) - drops when a driver retires
        let formulaType = DriverUtils.FORMULA_TYPE.F1_MODERN;
        let sessionType = null;
        
        // SimHub: isincreasing(6000, [F1TVPlugin.Mini Leaderboard]) - sponsor shows for the first
        // 6 seconds after the overlay is switched on (if sponsor logos are on), fade via CSS
        function startSponsorDisplay() {
            clearTimeout(sponsorTimeout);
            if (!showSponsors) return;
            sponsorElement.classList.add('is-shown');
            sponsorTimeout = setTimeout(hideSponsor, 6000);
        }

        function hideSponsor() {
            clearTimeout(sponsorTimeout);
            sponsorTimeout = null;
            sponsorElement.classList.remove('is-shown');
        }

        // Handle overlay visibility from controller. overlay_config is re-broadcast on every config
        // change, so only react to the overlay actually being switched on/off.
        socket.on('overlay_config', (config) => {
            showSponsors = config.global?.showSponsors !== false;
            if (!showSponsors) hideSponsor();

            if (config.overlays && config.overlays['mini-leaderboard']) {
                const visible = config.overlays['mini-leaderboard'].visible === true;
                if (visible === isOverlayVisible) return;
                isOverlayVisible = visible;

                overlayContainer.classList.toggle('visible', visible);
                if (visible) startSponsorDisplay(); else hideSponsor();
            }
        });

        // Set a name and refit it only when the text actually changes - Lap Data arrives ~60x/s,
        // and refitting every tick is expensive (same idea as the leaderboards' textFitIfChanged)
        function setFittedName(el, text, minFontSize, maxFontSize) {
            // Key includes the size range - a row switching to/from observed has a different box/font
            const key = `${text}|${maxFontSize}`;
            if (el.dataset.fitted === key) return;
            el.dataset.fitted = key;
            el.textContent = text;
            textFit(el, {
                minFontSize,
                maxFontSize,
                multiLine: false,
                detectMultiLine: false,
                alignHoriz: true,
                alignVert: false,
                widthOnly: true
            });
        }
        
        // Load driver data using DriverUtils
        async function loadDriverData() {
            try {
                const data = await DriverUtils.loadDriverData(formulaType);
                customDrivers = data.customDrivers;
                teamNames = data.teamNames;
                console.log('[Mini Leaderboard] Loaded driver data:', customDrivers.length, 'custom drivers');
            } catch (error) {
                console.error('[Mini Leaderboard] Error loading driver data:', error);
            }
        }
        
        // Socket listeners
        socket.on('drivers_data', (data) => {
            aiDrivers = data;
            console.log('[Mini Leaderboard] AI Drivers loaded:', Object.keys(aiDrivers).length);
        });
        
        socket.on('f1_data', (data) => {
            const packetId = data.m_header?.m_packetId;
            
            // Session packet (ID 1) - Get player index, formula type, and session type
            if (packetId === 1) {
                rawPlayerIndex = data.m_header.m_playerCarIndex;
                isSpectating      = data.m_isSpectating      ?? isSpectating;
                spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;
                playerIndex = DriverUtils.getActiveDriverIndex(rawPlayerIndex, isSpectating, spectatorCarIndex);
                sessionType = data.m_sessionType;
                
                if (data.m_formula !== undefined && data.m_formula !== formulaType) {
                    formulaType = data.m_formula;
                    console.log('[Mini Leaderboard] Formula type:', formulaType);
                    loadDriverData();
                }
            }
            
            // Participants packet (ID 4) - Get driver names using DriverUtils
            if (packetId === 4) {
                participantsActiveCars = data.m_numActiveCars || 0;
                participants = data.m_participants || [];
                participantLastNames = {};
                
                participants.forEach((participant, idx) => {
                    const driverName = DriverUtils.getDriverLastName(
                        participant,
                        aiDrivers,
                        customDrivers,
                        teamNames
                    );
                    participantLastNames[idx] = driverName;
                });
            }
            
            // Lap Data packet (ID 2) - Update positions
            if (packetId === 2 && playerIndex !== null && Array.isArray(data.m_lapData)) {
                const playerLapData = data.m_lapData[playerIndex];
                if (!playerLapData) return;

                // m_numActiveCars can under-report (it drops when a driver retires), so merge it with the
                // highest assigned position seen in Lap Data - same fix as leaderboard.html / leaderboard-lastname.html.
                let maxPos = 0;
                for (const lap of data.m_lapData) {
                    if (lap.m_carPosition > maxPos) maxPos = lap.m_carPosition;
                }
                const numActiveCars = Math.max(participantsActiveCars, maxPos);

                const currentPosition = playerLapData.m_carPosition;
                if (!currentPosition) return;

                // "Last place" (SimHub [OpponentsCount]): in races a retired car is out of the fight, so
                // the raw m_numActiveCars is the running grid; in timed sessions a retired driver still
                // holds a lap time and a position, so keep the merged count there.
                let lastPosition = numActiveCars;
                if (isRaceSession(sessionType) && participantsActiveCars > 0) {
                    lastPosition = participantsActiveCars;
                }
                lastPosition = Math.max(lastPosition, currentPosition);

                // SimHub Observed Driver Top: if([Position]=1,60,if([Position]==[OpponentsCount],160,110))-50
                // -> top row when P1, bottom row when last, middle otherwise
                let observedRow = 1;
                if (currentPosition === 1) observedRow = 0;
                else if (currentPosition === lastPosition) observedRow = 2;
                const firstPosition = currentPosition - observedRow;

                let top = ROWS_TOP;
                rows.forEach((row, i) => {
                    const isObserved = i === observedRow;
                    const position = firstPosition + i;
                    const driverIdx = isObserved ? playerIndex : findDriverByPosition(data.m_lapData, position);

                    row.el.classList.toggle('is-observed', isObserved);
                    row.el.style.top = `${top}px`;
                    top += isObserved ? OBSERVED_ROW_HEIGHT : ROW_HEIGHT;

                    // Fewer than 3 cars (or no driver in that slot) - keep the line, just empty
                    if (position < 1 || driverIdx === -1) {
                        row.el.classList.add('is-empty');
                        return;
                    }
                    row.el.classList.remove('is-empty');

                    row.positionEl.textContent = position;
                    setFittedName(row.nameEl, participantLastNames[driverIdx] || '', isObserved ? 17 : 14, isObserved ? 27 : 24);
                    row.el.classList.toggle('is-knockout', DriverUtils.isInKnockoutZone(position, sessionType, numActiveCars));
                });
            }
        });

        function isRaceSession(type) {
            const T = DriverUtils.SESSION_TYPE;
            return type === T.RACE || type === T.RACE_2 || type === T.RACE_3;
        }
        
        // Helper function to find driver index by position
        function findDriverByPosition(lapData, targetPosition) {
            return lapData.findIndex(lap => lap.m_carPosition === targetPosition);
        }
        
        console.log('[Mini Leaderboard] Overlay loaded');
    </script>
</body>
</html>
