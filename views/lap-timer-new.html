<!DOCTYPE html>
<html>
<head>
    <title>F1 Lap Timer Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-lap-timer-new.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="lt is-instant">
        <!-- DRIVER BAR -->
        <div class="lt-driver">
            <div class="lt-driver__knockout"></div>
            <div class="lt-driver__gained"></div>
            <div class="lt-driver__lost"></div>
            <div class="lt-driver__position"></div>
            <div class="lt-driver__logo"></div>
            <div class="lt-driver__name"></div>
            <div class="lt-driver__tyre"></div>
        </div>

        <!-- TIMING PANEL -->
        <div class="lt-timing">
            <div class="lt-timing__bg"></div>
            <div class="lt-f2blur lt-f2blur--timing"><div class="lt-f2blur__scale"><div class="lt-f2blur__ellipse"></div></div></div>
            <div class="lt-timing__panel">
                <div class="lt-timing__divider"></div>
                <div class="lt-timing__big">0.0</div>
                <div class="lt-timing__ref-time"></div>
                <div class="lt-timing__ref-name"></div>
            </div>
            <div class="lt-gradient lt-gradient--timing"></div>
            <div class="lt-timing__popup"></div>
        </div>

        <!-- SECTOR BAR -->
        <div class="lt-sectors">
            <div class="lt-sectors__bg"></div>
            <div class="lt-f2blur lt-f2blur--sectors"><div class="lt-f2blur__scale"><div class="lt-f2blur__ellipse"></div></div></div>
            <div class="lt-sectors__line"></div>
            <div class="lt-sectors__cols">
                <div class="lt-sector"><div class="lt-sector__label">S1</div><div class="lt-sector__bar"></div></div>
                <div class="lt-sector"><div class="lt-sector__label">S2</div><div class="lt-sector__bar"></div></div>
                <div class="lt-sector"><div class="lt-sector__label">S3</div><div class="lt-sector__bar"></div></div>
            </div>
        </div>

        <div class="lt-gradient lt-gradient--sectors"></div>
        <div class="lt-rolex"><img src="/images/other-logos/Rolex.png"></div>
        <div class="lt-stroke"></div>
    </div>
    <script>
        const socket = io();
        socket.emit('identify', 'Lap Timer');

        const { SESSION_TYPE, FORMULA_TYPE, KNOCKOUT_ZONE_POSITIONS } = DriverUtils;

        const VISUAL_TYRE_COMPOUND = {
            7: 'I', 8: 'W', 15: 'W',                 // Inter, Wet (F1), Wet (F2)
            16: 'S', 17: 'M', 18: 'H',               // F1 slicks
            19: 'SS', 20: 'S', 21: 'M', 22: 'H'      // F2 slicks
        };

        const DRIVER_STATUS = { GARAGE: 0, FLYING_LAP: 1, IN_LAP: 2, OUT_LAP: 3, ON_TRACK: 4 };
        const SAFETY_CAR_FORMATION_LAP = 3;

        // Display windows, in ms after the moment a sector/lap was completed
        const TIMING = {
            SECTOR_RESULT: 4000,   // S1/S2: delta (or raw split) + the reference it was compared to
            LAP_RESULT: 4000,      // line: lap delta + reference (the panel slides away at POPUP_START anyway)
            POPUP_START: 2000,     // panel slides away, Last Lap popup slides in... (SimHub:
            POPUP_END: 6000,       // ...and back out    changed(6000, LastLapTime) and CurrentLap > 2s)
            SECTOR_LABEL: 4000,    // "SECTOR n" label + Rolex after S1/S2
            LAP_LABEL: 6000,       // "SECTOR 3" label after the line; the finished lap's bar clears after this
            ROLEX: 4000,           // Rolex after any crossing (conditions in rolexAfter())
            POSITION_CHANGE: 2000  // green/red arrow by the position after gaining/losing a place
        };

        // Time Trial (packet 14) dataset per Controller mode
        const TT_DATASETS = {
            playerSessionBest: { key: 'm_playerSessionBestDataSet', label: 'SESSION BEST' },
            personalBest:      { key: 'm_personalBestDataSet',      label: 'PERSONAL BEST' },
            rival:             { key: 'm_rivalDataSet',             label: 'RIVAL' }
        };

        const root = document.querySelector('.lt');
        const el = {
            driver:   root.querySelector('.lt-driver'),
            position: root.querySelector('.lt-driver__position'),
            logo:     root.querySelector('.lt-driver__logo'),
            name:     root.querySelector('.lt-driver__name'),
            tyre:     root.querySelector('.lt-driver__tyre'),
            timing:   root.querySelector('.lt-timing'),
            big:      root.querySelector('.lt-timing__big'),
            refTime:  root.querySelector('.lt-timing__ref-time'),
            refName:  root.querySelector('.lt-timing__ref-name'),
            popup:    root.querySelector('.lt-timing__popup'),
            sectors:  [...root.querySelectorAll('.lt-sector')].map(node => ({
                node,
                label: node.querySelector('.lt-sector__label')
            }))
        };

        // ── State ─────────────────────────────────────────────────────────────────
        // Packet handlers only write here; render() derives the whole DOM from it.
        const config = {
            visibilityMode: 'automatic',          // off / automatic / always-on
            ttComparisonMode: 'personalBest',     // playerSessionBest / personalBest / rival
            knockoutComparisonMode: 'default',    // default / alwaysLeader
            raceComparisonMode: 'personalBest',   // fastestLap / personalBest / lastLap
            showSponsors: true                    // global (all overlays): Rolex logo
        };

        const session = {
            sessionType: SESSION_TYPE.UNKNOWN,
            formulaType: FORMULA_TYPE.F1_MODERN,
            trackLength: -1,
            safetyCarStatus: 0,
            isSpectating: 0,
            spectatorCarIndex: 255,
            playerCarIndex: -1                    // m_header.m_playerCarIndex, unmodified
        };

        const driverData = { aiDrivers: {}, customDrivers: [], teamNames: {} };
        let participants = [];
        let numActiveCars = 20;

        // Reference data: per-car Session History, field-wide bests, latest Time Trial packet
        const historyByCar = {};
        const fieldBest = { sectors: [-1, -1, -1], lap: null, raceLap: null };
        let timeTrial = null;
        let targetIdx = -1;                       // car whose best lap is the reference (Practice/Qualifying)

        // The car the overlay follows (player, or the spectated car) and its live values
        let activeIdx = -1;
        const live = {
            position: 0,
            lapNum: 0,
            sector: 0,
            currentLapTimeMS: 0,
            tyre: '?'
        };

        // Lap progress of the followed car, to detect sector/lap completions. Initialized from the
        // first packet without firing, so joining mid-lap (or switching cars) doesn't fake a crossing.
        const progress = {
            initialized: false,
            lapNum: 0,
            s1MS: 0,                              // this lap's S1 split, once crossed
            s12MS: 0,                             // this lap's S1+S2, once crossed
            lastLapMS: 0,                         // m_lastLapTimeInMS as of the previous packet
            lapInvalid: false,                    // m_currentLapInvalid as of the previous packet
            pendingLap: null                     // line crossed, waiting for m_lastLapTimeInMS to update
        };

        // Frozen results. A result's `at` is when the car actually crossed (back-dated from the lap
        // timer, so a late packet doesn't shift the display windows).
        let lastResult = null;                    // { lap, sector, at, timeMS, ref: { name, timeMS } | null }
        let lapSectors = [null, null, null];      // this lap's sector bar: { state, at } per sector
        let finishedLap = null;                   // { sectors, at } - the lap just finished, shown until LAP_LABEL

        let positionChange = null;                // { gained, at } - last position change of the followed car

        let autoVisible = false;                 // automatic-mode verdict, tracked even while the mode is off/always-on
        let wasVisible = false;
        let wakeTimer = null;

        // ── DOM helpers ───────────────────────────────────────────────────────────
        function setText(node, text) {
            if (node.textContent !== text) node.textContent = text;
        }

        // Like setText, but every digit goes in its own fixed-width .lt-digit cell (tabular figures)
        function setTabularText(node, text) {
            if (node._tabularText === text) return;
            node._tabularText = text;
            node.innerHTML = text.replace(/\d/g, '<span class="lt-digit">$&</span>');
        }

        function setData(node, key, value) {
            if (value == null) {
                if (key in node.dataset) delete node.dataset[key];
            } else if (node.dataset[key] !== value) {
                node.dataset[key] = value;
            }
        }

        function textFitIfChanged(node, text, opts) {
            if (node._lastFitText === text && node.firstElementChild?.classList.contains('textFitted')) return;
            try {
                node.textContent = text;
                textFit(node, opts);
                node._lastFitText = text;
            } catch (e) {
                // textFit throws on detached/zero-size nodes - next render retries
            }
        }

        // ── Formatting ────────────────────────────────────────────────────────────
        // Live lap time: tenths, truncated (SimHub "s.f" / "m:ss.f")
        function formatLiveTime(ms) {
            if (!(ms > 0)) return '0.0';
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor(ms / 1000) % 60;
            const tenths = Math.floor(ms / 100) % 10;
            return minutes > 0
                ? `${minutes}:${String(seconds).padStart(2, '0')}.${tenths}`
                : `${seconds}.${tenths}`;
        }

        // Splits and deltas: milliseconds, minutes only when needed ("27.812" / "1:02.604")
        function formatSplit(ms) {
            const minutes = Math.floor(ms / 60000);
            const seconds = Math.floor(ms / 1000) % 60;
            const millis = String(ms % 1000).padStart(3, '0');
            return minutes > 0
                ? `${minutes}:${String(seconds).padStart(2, '0')}.${millis}`
                : `${seconds}.${millis}`;
        }

        // Full lap time, always with minutes ("m:ss.fff")
        function formatLapTime(ms) {
            const seconds = Math.floor(ms / 1000) % 60;
            return `${Math.floor(ms / 60000)}:${String(seconds).padStart(2, '0')}.${String(ms % 1000).padStart(3, '0')}`;
        }

        // ── Session helpers ───────────────────────────────────────────────────────
        function isRace() {
            return session.sessionType >= SESSION_TYPE.RACE && session.sessionType <= SESSION_TYPE.RACE_3;
        }

        // Last position that survives the knockout, or null outside Q1/Q2 (and their Sprint Shootout twins)
        function knockoutThreshold() {
            const type = session.sessionType;
            if (type === SESSION_TYPE.QUALIFYING_1 || type === SESSION_TYPE.SPRINT_SHOOTOUT_1) {
                return numActiveCars > 22 ? KNOCKOUT_ZONE_POSITIONS.Q1_24_CARS
                    : numActiveCars > 20 ? KNOCKOUT_ZONE_POSITIONS.Q1_22_CARS
                    : KNOCKOUT_ZONE_POSITIONS.Q1_20_CARS;
            }
            if (type === SESSION_TYPE.QUALIFYING_2 || type === SESSION_TYPE.SPRINT_SHOOTOUT_2) {
                return KNOCKOUT_ZONE_POSITIONS.Q2;
            }
            return null;
        }

        // ── Visibility ────────────────────────────────────────────────────────────
        // Automatic mode: hidden in the garage; Practice/Qualifying appear from 90% into the out lap
        // and then stay up until the garage; Races are always up except during the Formation Lap.
        function computeAutoVisible(lap) {
            if (lap.m_driverStatus === DRIVER_STATUS.GARAGE) return false;

            const type = session.sessionType;
            if (type >= SESSION_TYPE.PRACTICE_1 && type <= SESSION_TYPE.ONE_SHOT_SPRINT_SHOOTOUT) {
                if (lap.m_driverStatus !== DRIVER_STATUS.OUT_LAP) return autoVisible;
                if (session.trackLength <= 0) return false;
                // Negative lap distance only happens on the first out lap from the garage
                return lap.m_lapDistance < 0
                    ? lap.m_lapDistance > -session.trackLength * 0.1
                    : lap.m_lapDistance / session.trackLength >= 0.9;
            }
            if (isRace()) {
                return session.safetyCarStatus !== SAFETY_CAR_FORMATION_LAP;
            }
            return true;
        }

        function isVisible() {
            return config.visibilityMode === 'always-on' ||
                (config.visibilityMode === 'automatic' && autoVisible);
        }

        // ── Driver identity (name, team logo) ─────────────────────────────────────
        async function loadDriverData() {
            try {
                const data = await DriverUtils.loadDriverData(session.formulaType);
                driverData.customDrivers = data.customDrivers;
                driverData.teamNames = data.teamNames;
            } catch (error) {
                console.error('[LapTimer] Error loading driver data:', error);
                driverData.customDrivers = [];
                driverData.teamNames = {};
            }
            render();
        }

        function driverLastName(idx) {
            const participant = participants[idx];
            if (!participant) return '';
            return DriverUtils.getDriverLastName(
                participant, driverData.aiDrivers, driverData.customDrivers, driverData.teamNames
            ).toUpperCase();
        }

        // ── Session History / references ──────────────────────────────────────────
        // Split times of one Session History lap entry: [S1, S2, S3] and the full lap
        function lapEntrySectors(entry) {
            return [
                entry.m_sector1TimeMinutesPart * 60000 + entry.m_sector1TimeMSPart,
                entry.m_sector2TimeMinutesPart * 60000 + entry.m_sector2TimeMSPart,
                entry.m_sector3TimeMinutesPart * 60000 + entry.m_sector3TimeMSPart
            ];
        }

        // Cumulative reference splits { s1, s12, lap } from a Session History lap entry
        function splitsFromEntry(entry) {
            if (!entry || !(entry.m_lapTimeInMS > 0)) return null;
            const [s1, s2] = lapEntrySectors(entry);
            return { s1, s12: s1 + s2, lap: entry.m_lapTimeInMS };
        }

        // Fastest completed lap in this session's history by a metric (sector index 0-2, or 3 = lap).
        // m_bestLapTimeLapNum & co. aren't trusted directly: Time Trial reports a sentinel (e.g. 199)
        // pointing at a Personal Best from an earlier session that isn't in this history.
        // firstLap skips laps from the start (1 = leave out lap 1).
        function bestEntryBy(laps, numLaps, metric, firstLap = 0) {
            let best = null;
            let bestMS = Infinity;
            for (const entry of laps.slice(firstLap, numLaps)) {
                const ms = metric === 3 ? entry.m_lapTimeInMS : lapEntrySectors(entry)[metric];
                if (ms > 0 && ms < bestMS) {
                    best = entry;
                    bestMS = ms;
                }
            }
            return best ? { entry: best, ms: bestMS } : null;
        }

        function storeSessionHistory(data) {
            const laps = data.m_lapHistoryData || [];
            const numLaps = Math.min(data.m_numLaps || 0, laps.length);
            historyByCar[data.m_carIdx] = {
                laps,
                numLaps,
                best: [0, 1, 2, 3].map(metric => bestEntryBy(laps, numLaps, metric)),
                // Race references leave out lap 1: a standing start (or rolling start behind the
                // Safety Car) is no lap to compare against
                bestRaceLap: bestEntryBy(laps, numLaps, 3, 1)
            };

            // Field-wide bests: purple sectors, any lap time at all (Rolex), Race "Fastest Lap" reference.
            // Time Trial fills the other car slots with ghosts (Default Ghost, Personal Best, Rival and
            // empty copies of the player) whose history can hold stale laps - only the driven car counts.
            // Filtered here rather than on arrival: Session History can arrive before the Session packet.
            fieldBest.sectors = [-1, -1, -1];
            fieldBest.lap = null;
            fieldBest.raceLap = null;
            for (const [idx, history] of Object.entries(historyByCar)) {
                if (session.sessionType === SESSION_TYPE.TIME_TRIAL && Number(idx) !== activeIdx) continue;
                for (let s = 0; s < 3; s++) {
                    const ms = history.best[s]?.ms;
                    if (ms && (fieldBest.sectors[s] === -1 || ms < fieldBest.sectors[s])) fieldBest.sectors[s] = ms;
                }
                const bestLap = history.best[3];
                if (bestLap && (!fieldBest.lap || bestLap.ms < fieldBest.lap.ms)) fieldBest.lap = bestLap;
                const raceLap = history.bestRaceLap;
                if (raceLap && (!fieldBest.raceLap || raceLap.ms < fieldBest.raceLap.ms)) fieldBest.raceLap = raceLap;
            }
        }

        function bestLapSplits(carIdx) {
            return splitsFromEntry(historyByCar[carIdx]?.best[3]?.entry);
        }

        // Practice/Qualifying reference car: the leader, or in Q1/Q2 the car on the knockout line
        // while the followed car is below it (unless the Controller says always compare to the leader).
        // The previous target is kept while the data is mid-change, instead of flicking to the leader or
        // blanking the reference: positions can skip the knockout line for a packet while cars reshuffle,
        // and a new candidate's Session History can trail its position change by a second or so.
        function selectTargetCar(lapData) {
            const carAt = pos => lapData.findIndex(lap => lap?.m_carPosition === pos);
            const keepPrevious = bestLapSplits(targetIdx) ? targetIdx : -1;
            const threshold = config.knockoutComparisonMode === 'alwaysLeader' ? null : knockoutThreshold();
            if (threshold && live.position > threshold) {
                const idx = carAt(threshold);
                if (idx === -1 || !historyByCar[idx]) {
                    if (keepPrevious !== -1) return keepPrevious;
                } else if (bestLapSplits(idx)) {
                    return idx;
                }
                // Knockout-line car without a time yet: compare to the leader instead
            }
            const leader = carAt(1);
            if (bestLapSplits(leader)) return leader;
            return keepPrevious !== -1 ? keepPrevious : leader;
        }

        // What the followed car is currently compared against: { name, s1, s12, lap } or null
        function currentReference() {
            if (session.sessionType === SESSION_TYPE.TIME_TRIAL) {
                const dataset = TT_DATASETS[config.ttComparisonMode] || TT_DATASETS.personalBest;
                const data = timeTrial?.[dataset.key];
                // m_lapTimeInMS 0 = no time set yet. m_valid is the lap's legality flag, not "dataset exists".
                if (!(data?.m_lapTimeInMS > 0)) return null;
                return {
                    name: dataset.label,
                    s1: data.m_sector1TimeInMS,
                    s12: data.m_sector1TimeInMS + data.m_sector2TimeInMS,
                    lap: data.m_lapTimeInMS
                };
            }

            if (isRace()) {
                if (config.raceComparisonMode === 'lastLap') {
                    // m_numLaps includes the lap in progress, so the last completed lap is one slot before it
                    const history = historyByCar[activeIdx];
                    const splits = splitsFromEntry(history?.laps[history.numLaps - 2]);
                    return splits && { name: 'LAST LAP', ...splits };
                }
                // No reference until a lap 2 or later is in, so lap 2 itself finishes with its raw time
                if (config.raceComparisonMode === 'fastestLap') {
                    const splits = splitsFromEntry(fieldBest.raceLap?.entry);
                    return splits && { name: 'FASTEST LAP', ...splits };
                }
                const splits = splitsFromEntry(historyByCar[activeIdx]?.bestRaceLap?.entry);
                return splits && { name: 'PERSONAL BEST', ...splits };
            }

            const splits = bestLapSplits(targetIdx);
            return splits && { name: driverLastName(targetIdx), ...splits };
        }

        // The reference time for a sector: S1 split, S1+S2 split, or full lap
        function referenceFor(ref, sector) {
            const timeMS = ref ? [ref.s1, ref.s12, ref.lap][sector] : 0;
            return timeMS > 0 ? { name: ref.name, timeMS } : null;
        }

        // ── Sector / lap completions ──────────────────────────────────────────────
        // Bar color of a just-completed sector: purple = fastest of anyone this session,
        // green = the car's own best, yellow = neither. Compared against history from *before*
        // the crossing (Session History only catches up after it), so ties count: SimHub reads
        // the bests *after* they include this sector and checks for equality instead.
        function sectorState(sector, sectorMS) {
            const fieldMS = fieldBest.sectors[sector];
            if (fieldMS === -1 || sectorMS <= fieldMS) return 'overall';
            const personalMS = historyByCar[activeIdx]?.best[sector]?.ms;
            if (!personalMS || sectorMS <= personalMS) return 'pb';
            return 'slower';
        }

        // Whether a crossing brings up the Rolex (SimHub opacity formula): after S1/S2 only once someone
        // has a lap time this session, after the line only if the car has a best lap - i.e. not for a
        // first lap that was invalidated. Evaluated with pre-crossing history, hence the lapValid check.
        function rolexAfter(sector, lapValid) {
            if (sector < 2) return !!fieldBest.lap;
            return lapValid || !!historyByCar[activeIdx]?.best[3];
        }

        // sector: 0/1 = S1/S2 crossed, 2 = line crossed. cumulativeMS is the split (or lap) time.
        function completeSector(sector, sectorMS, cumulativeMS, at, ref, rolex) {
            const entry = { state: sectorMS > 0 ? sectorState(sector, sectorMS) : null, at };
            if (sector < 2) {
                lapSectors[sector] = entry;
            } else {
                finishedLap = { sectors: [lapSectors[0], lapSectors[1], entry], at };
                lapSectors = [null, null, null];
            }
            lastResult = { lap: sector === 2, sector, at, timeMS: cumulativeMS, ref: referenceFor(ref, sector), rolex };
        }

        function trackProgress(lap, now) {
            const s1MS = lap.m_sector1TimeMinutesPart * 60000 + lap.m_sector1TimeMSPart;
            const s2MS = lap.m_sector2TimeMinutesPart * 60000 + lap.m_sector2TimeMSPart;
            const s12MS = s1MS > 0 && s2MS > 0 ? s1MS + s2MS : 0;
            const lapStart = now - lap.m_currentLapTimeInMS;

            if (!progress.initialized || lap.m_currentLapNum < progress.lapNum || lap.m_currentLapNum > progress.lapNum + 1) {
                // First packet, a flashback to an earlier lap, or a gap - resync silently
                Object.assign(progress, {
                    initialized: true, lapNum: lap.m_currentLapNum, s1MS, s12MS,
                    lastLapMS: lap.m_lastLapTimeInMS, pendingLap: null
                });
                return;
            }

            if (lap.m_currentLapNum === progress.lapNum + 1) {
                // Line crossed: lock in the finished lap's splits and the reference it was chasing
                progress.pendingLap = {
                    s12MS: progress.s12MS,
                    prevLastLapMS: progress.lastLapMS,
                    ref: currentReference(),
                    rolex: rolexAfter(2, !progress.lapInvalid),
                    at: lapStart
                };
                Object.assign(progress, { lapNum: lap.m_currentLapNum, s1MS: 0, s12MS: 0 });
            }

            // m_lastLapTimeInMS can trail the lap counter by a packet or so. An identical time to the
            // previous lap is accepted once the new lap is a second old.
            const pending = progress.pendingLap;
            if (pending && lap.m_lastLapTimeInMS > 0 &&
                (lap.m_lastLapTimeInMS !== pending.prevLastLapMS || lap.m_currentLapTimeInMS > 1000)) {
                const sector3MS = pending.s12MS > 0 ? lap.m_lastLapTimeInMS - pending.s12MS : -1;
                completeSector(2, sector3MS, lap.m_lastLapTimeInMS, pending.at, pending.ref, pending.rolex);
                progress.pendingLap = null;
            }
            progress.lastLapMS = lap.m_lastLapTimeInMS;
            progress.lapInvalid = lap.m_currentLapInvalid === 1;

            // Splits only ever appear once per lap; one going back to 0 means a flashback within the lap.
            // The m_sector check keeps a previous-lap split that lingers into the line-crossing packet out.
            if (s1MS > 0 && progress.s1MS === 0 && lap.m_sector >= 1) {
                completeSector(0, s1MS, s1MS, lapStart + s1MS, currentReference(), rolexAfter(0));
            }
            if (s12MS > 0 && progress.s12MS === 0 && lap.m_sector >= 2) {
                completeSector(1, s12MS - s1MS, s12MS, lapStart + s12MS, currentReference(), rolexAfter(1));
            }
            if (lap.m_sector >= 1 || s1MS === 0) progress.s1MS = s1MS;
            if (lap.m_sector >= 2 || s12MS === 0) progress.s12MS = s12MS;
        }

        // ── Render ────────────────────────────────────────────────────────────────
        function clearResults() {
            lastResult = null;
            lapSectors = [null, null, null];
            finishedLap = null;
        }

        // Team logo standard (matches Leaderboard/Fastest Sectors/Pit Timer): background is the team
        // color (OverridePrimaryColor → livery → static fallback), logo prefers Logo_Alt over Logo, and
        // the layer stays transparent if neither logo file resolves. Only reloads when the inputs change.
        function renderTeamLogo() {
            const participant = participants[activeIdx];
            const teamData = participant ? driverData.teamNames[participant.m_teamId] : null;
            const logoFile = teamData?.Logo_Alt ?? teamData?.Logo ?? null;
            const livery = participant?.m_liveryColour?.[0];
            const liveryColor = (livery && typeof livery.red === 'number')
                ? `rgb(${livery.red}, ${livery.green}, ${livery.blue})`
                : null;
            const bgColor = teamData?.OverridePrimaryColor || liveryColor || '#081425FF';

            const key = `${logoFile}|${bgColor}`;
            if (el.logo._key === key) return;
            el.logo._key = key;

            el.logo.style.backgroundColor = 'transparent';
            el.logo.style.backgroundImage = 'none';
            if (!logoFile) return;

            const logoPath = `/images/team-logos/${logoFile}`;
            const img = new Image();
            img.onload = () => {
                if (el.logo._key !== key) return; // superseded while loading
                el.logo.style.backgroundColor = bgColor;
                el.logo.style.backgroundImage = `url(${logoPath})`;
            };
            img.src = logoPath;
        }

        function renderDriverName() {
            const name = driverLastName(activeIdx);
            el.name.classList.toggle('is-long', name.length > 10);
            textFitIfChanged(el.name, name, {
                minFontSize: 22,
                maxFontSize: 32,
                multiLine: false,
                detectMultiLine: false,
                alignHoriz: false,
                widthOnly: true
            });
        }

        // Left half: a live result while its window is open, otherwise the running lap time
        function renderBig(result) {
            let tone = null;
            if (!result) {
                setTabularText(el.big, formatLiveTime(live.currentLapTimeMS));
            } else if (result.ref) {
                const delta = result.timeMS - result.ref.timeMS;
                setTabularText(el.big, `${delta >= 0 ? '+' : '-'}${formatSplit(Math.abs(delta))}`);
                tone = delta > 0 ? 'is-slower' : 'is-faster';
            } else {
                setTabularText(el.big, formatSplit(result.timeMS));
            }
            el.big.classList.toggle('is-result', !!result);
            el.big.classList.toggle('is-faster', tone === 'is-faster');
            el.big.classList.toggle('is-slower', tone === 'is-slower');
        }

        // Right half: the reference a live result was compared to, otherwise the current sector's reference
        function renderReference(result) {
            const ref = result ? result.ref : referenceFor(currentReference(), live.sector);
            setText(el.refTime, ref ? formatSplit(ref.timeMS) : '');
            textFitIfChanged(el.refName, ref ? ref.name : '', {
                minFontSize: 12,
                maxFontSize: 23,
                multiLine: false,
                detectMultiLine: false,
                widthOnly: true
            });
        }

        function renderSectorBar(now, deadlines) {
            const showFinished = finishedLap && now - finishedLap.at < TIMING.LAP_LABEL;
            if (showFinished) deadlines.push(finishedLap.at + TIMING.LAP_LABEL);
            const sectors = showFinished ? finishedLap.sectors : lapSectors;

            sectors.forEach((entry, i) => {
                const labelEnd = entry ? entry.at + (i === 2 ? TIMING.LAP_LABEL : TIMING.SECTOR_LABEL) : 0;
                const announce = now < labelEnd;
                if (announce) deadlines.push(labelEnd);
                setData(el.sectors[i].node, 'state', entry?.state);
                setText(el.sectors[i].label, announce ? `SECTOR ${i + 1}` : `S${i + 1}`);
            });
        }

        function renderRolex(now, deadlines) {
            const rolexEnd = lastResult?.rolex ? lastResult.at + TIMING.ROLEX : 0;
            if (now < rolexEnd) deadlines.push(rolexEnd);
            root.classList.toggle('is-rolex', config.showSponsors && now < rolexEnd);
        }

        function render() {
            const now = performance.now();
            const deadlines = [];

            const visible = isVisible();
            if (wasVisible && !visible) clearResults();
            wasVisible = visible;
            root.classList.toggle('is-visible', visible);
            root.classList.toggle('is-f2', session.formulaType === FORMULA_TYPE.F2);

            // Driver bar
            el.driver.classList.toggle('is-knockout',
                DriverUtils.isInKnockoutZone(live.position, session.sessionType, numActiveCars));
            const changeEnd = positionChange ? positionChange.at + TIMING.POSITION_CHANGE : 0;
            if (now < changeEnd) deadlines.push(changeEnd);
            el.driver.classList.toggle('is-gained', now < changeEnd && positionChange.gained);
            el.driver.classList.toggle('is-lost', now < changeEnd && !positionChange.gained);
            setText(el.position, live.position > 0 ? String(live.position) : '');
            renderTeamLogo();
            renderDriverName();
            setText(el.tyre, live.tyre);
            setData(el.tyre, 'compound', live.tyre);

            // Timing panel: which result (if any) is inside its display window
            let result = null;
            let popup = false;
            if (lastResult) {
                const age = now - lastResult.at;
                const resultEnd = lastResult.lap ? TIMING.LAP_RESULT : TIMING.SECTOR_RESULT;
                if (age < resultEnd) {
                    result = lastResult;
                    deadlines.push(lastResult.at + resultEnd);
                }
                if (lastResult.lap && age < TIMING.POPUP_END) {
                    popup = age >= TIMING.POPUP_START;
                    deadlines.push(lastResult.at + (popup ? TIMING.POPUP_END : TIMING.POPUP_START));
                    setText(el.popup, formatLapTime(lastResult.timeMS));
                }
            }
            el.timing.classList.toggle('is-popup', popup);
            renderBig(result);
            renderReference(result);
            renderSectorBar(now, deadlines);
            renderRolex(now, deadlines);

            // Re-render when the next window opens/closes, even if packets stop (e.g. game paused)
            clearTimeout(wakeTimer);
            if (deadlines.length) wakeTimer = setTimeout(render, Math.max(0, Math.min(...deadlines) - now) + 10);
        }

        // ── Packet handlers ───────────────────────────────────────────────────────
        function handleSession(data) {
            session.sessionType = data.m_sessionType;
            session.trackLength = data.m_trackLength || -1;
            session.safetyCarStatus = data.m_safetyCarStatus || 0;
            session.isSpectating = data.m_isSpectating ?? session.isSpectating;
            session.spectatorCarIndex = data.m_spectatorCarIndex ?? session.spectatorCarIndex;

            if (session.formulaType !== data.m_formula) {
                session.formulaType = data.m_formula;
                loadDriverData();
            }
        }

        function handleLapData(data) {
            session.playerCarIndex = data.m_header.m_playerCarIndex ?? session.playerCarIndex;
            const idx = DriverUtils.getActiveDriverIndex(session.playerCarIndex, session.isSpectating, session.spectatorCarIndex);
            const lap = data.m_lapData[idx];
            if (!lap) return;

            if (idx !== activeIdx) {
                activeIdx = idx;
                resetDriverState();
            }

            if (live.position > 0 && lap.m_carPosition > 0 && lap.m_carPosition !== live.position) {
                positionChange = { gained: lap.m_carPosition < live.position, at: performance.now() };
            }
            live.position = lap.m_carPosition;
            live.lapNum = lap.m_currentLapNum;
            live.sector = lap.m_sector;
            live.currentLapTimeMS = lap.m_currentLapTimeInMS;
            autoVisible = computeAutoVisible(lap);
            targetIdx = selectTargetCar(data.m_lapData);
            trackProgress(lap, performance.now());
        }

        function handleParticipants(data) {
            participants = data.m_participants || [];
            numActiveCars = data.m_numActiveCars || 0;
        }

        function handleCarStatus(data) {
            const status = data.m_carStatusData[activeIdx];
            if (status) live.tyre = VISUAL_TYRE_COMPOUND[status.m_visualTyreCompound] || '?';
        }

        function handleTimeTrial(data) {
            timeTrial = data;
        }

        // Per-car display state - cleared when the followed car changes (spectating) or a session starts
        function resetDriverState() {
            live.position = 0;
            positionChange = null;
            live.lapNum = 0;
            live.sector = 0;
            live.currentLapTimeMS = 0;
            live.tyre = '?';
            progress.initialized = false;
            clearResults();
        }

        function resetSession() {
            resetDriverState();
            autoVisible = false;
            session.safetyCarStatus = 0;
            for (const key in historyByCar) delete historyByCar[key];
            fieldBest.sectors = [-1, -1, -1];
            fieldBest.lap = null;
            fieldBest.raceLap = null;
            timeTrial = null;
            targetIdx = -1;
        }

        // ── Socket ────────────────────────────────────────────────────────────────
        socket.on('drivers_data', (data) => {
            driverData.aiDrivers = data;
            render();
        });

        socket.on('overlay_config', (cfg) => {
            config.showSponsors = cfg.global?.showSponsors !== false;

            const lapTimerConfig = cfg.overlays?.['lap-timer'];
            if (!lapTimerConfig) return;

            config.visibilityMode = lapTimerConfig.visibilityMode || 'automatic';
            config.ttComparisonMode = lapTimerConfig.ttComparisonMode || 'personalBest';
            config.knockoutComparisonMode = lapTimerConfig.knockoutComparisonMode || 'default';
            config.raceComparisonMode = lapTimerConfig.raceComparisonMode || 'personalBest';
            render();

            // First config is applied without the show/hide transition
            if (root.classList.contains('is-instant')) {
                void root.offsetWidth;
                root.classList.remove('is-instant');
            }
        });

        const PACKET_HANDLERS = {
            1: handleSession,
            2: handleLapData,
            4: handleParticipants,
            7: handleCarStatus,
            11: storeSessionHistory,
            14: handleTimeTrial
        };

        socket.on('f1_data', (data) => {
            const packetId = data.m_header.m_packetId;

            if (packetId === 3) {
                if (String(data.m_eventStringCode) !== 'SSTA') return;
                resetSession();
            } else {
                const handler = PACKET_HANDLERS[packetId];
                if (!handler) return;
                handler(data);
            }
            render();
        });

        render();
        loadDriverData();
    </script>
</body>
</html>
