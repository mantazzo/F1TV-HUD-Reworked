<!DOCTYPE html>
<html>
<head>
    <title>F1 Speedometer Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-speedometer.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="overlay-container design-f1tv" data-tier="off">
        <!-- Back plates (swapped per design) -->
        <img id="spd-background" class="spd-layer spd-background" src="/images/speedometer/F1TV/F1TV_BG.png" alt="">
        <img id="spd-value-background" class="spd-layer spd-value-background" src="/images/speedometer/F1TV/F1TV_ValueBG.png" alt="">

        <!-- Sweep gauges: each canvas draws its gauge image, clipped to a pie slice -->
        <canvas id="spd-gauge-speed" class="spd-layer spd-gauge-speed"></canvas>
        <canvas id="spd-gauge-brake" class="spd-layer spd-gauge-pedal"></canvas>
        <canvas id="spd-gauge-throttle" class="spd-layer spd-gauge-pedal"></canvas>

        <!-- THROTTLE / BRAKE lettering, and the KMH / MPH ring lettering -->
        <img class="spd-layer spd-pedal-labels" src="/images/speedometer/Text.png" alt="">
        <img id="spd-units-image" class="spd-layer spd-units-image" src="/images/speedometer/KMH.png" alt="">

        <!-- Values -->
        <div id="spd-speed" class="spd-text spd-speed">0</div>
        <div id="spd-units" class="spd-text spd-label spd-units">KMH</div>
        <div id="spd-rpm" class="spd-text spd-rpm">0</div>
        <div class="spd-text spd-label spd-rpm-label">RPM</div>

        <!-- DRS / Overtake Mode indicator. F1TV uses images, Multiviewer a CSS rectangle. -->
        <div class="spd-indicator">
            <div class="spd-indicator-rect"></div>
            <img id="spd-indicator-base" class="spd-indicator-image" src="/images/speedometer/F1TV/drs.png" alt="">
            <img id="spd-indicator-border" class="spd-indicator-image spd-indicator-border" src="/images/speedometer/F1TV/drs2.png" alt="">
            <div id="spd-indicator-label" class="spd-text spd-indicator-label">DRS</div>
        </div>

        <div class="spd-text spd-gear-label">GEAR</div>
        <div id="spd-gear" class="spd-text spd-gear">N</div>
    </div>
    <script>
        const socket = io();
        socket.emit('identify', 'Speedometer');

        // ── Designs ────────────────────────────────────────────────────────
        // Gauge angles are canvas angles in degrees (0 = 3 o'clock, clockwise positive),
        // tuned by eye against the gauge images. A gauge sweeps from `from` towards `to`;
        // `to` < `from` sweeps anticlockwise (the brake gauge fills from the bottom up).
        // Paths stay as plain string literals so AssetPreloader finds them.
        const DESIGNS = {
            f1tv: {
                background:      '/images/speedometer/F1TV/F1TV_BG.png',
                valueBackground: '/images/speedometer/F1TV/F1TV_ValueBG.png',
                gauges: {
                    speed:    { image: '/images/speedometer/F1TV/Speed.png',    from: -238, to:  58 },
                    throttle: { image: '/images/speedometer/F1TV/Throttle.png', from: -238, to: -45 },
                    brake:    { image: '/images/speedometer/F1TV/Brake.png',    from:   58, to: -44 },
                },
            },
            multiviewer: {
                background:      '/images/speedometer/Multiviewer/MV BG.png',
                valueBackground: '/images/speedometer/Multiviewer/MV ValueBG.png',
                gauges: {
                    speed:    { image: '/images/speedometer/Multiviewer/Speed.png',    from: -238, to:  58 },
                    throttle: { image: '/images/speedometer/Multiviewer/Throttle.png', from: -238, to: -50 },
                    brake:    { image: '/images/speedometer/Multiviewer/Brake.png',    from:   58, to: -46 },
                },
            },
        };

        // F1TV indicator images. The base plate always shows (filled when active); the
        // border image sits on top and blinks while available — the same layering SimHub used.
        const INDICATOR_IMAGES = {
            drs:      { base: '/images/speedometer/F1TV/drs.png', active: '/images/speedometer/F1TV/drs1.png', border: '/images/speedometer/F1TV/drs2.png' },
            overtake: { base: '/images/speedometer/F1TV/OT.png',  active: '/images/speedometer/F1TV/OT2.png',  border: '/images/speedometer/F1TV/OT1.png' },
        };

        const UNITS_IMAGES = { kmh: '/images/speedometer/KMH.png', mph: '/images/speedometer/MPH.png' };
        const GAUGE_MAX_SPEED = { kmh: 360, mph: 225 }; // SimHub: if([SpeedLocalUnit]=='KMH',360,225)
        const KMH_TO_MPH = 0.621371;
        const ERS_MODE_BOOST = 3;    // m_ersDeployMode: 0 none, 1 medium, 2 hotlap, 3 boost
        const SMOOTHING_MS = 45;     // gauge easing time constant (exponential approach to the latest value)

        // ── Elements ───────────────────────────────────────────────────────
        const overlayContainer = document.querySelector('.overlay-container');
        const backgroundImage = document.getElementById('spd-background');
        const valueBackgroundImage = document.getElementById('spd-value-background');
        const unitsImage = document.getElementById('spd-units-image');
        const speedText = document.getElementById('spd-speed');
        const unitsText = document.getElementById('spd-units');
        const rpmText = document.getElementById('spd-rpm');
        const gearText = document.getElementById('spd-gear');
        const indicatorBase = document.getElementById('spd-indicator-base');
        const indicatorBorder = document.getElementById('spd-indicator-border');
        const indicatorLabel = document.getElementById('spd-indicator-label');

        // ── State ──────────────────────────────────────────────────────────
        const config = { designMode: null, unitsMode: 'automatic', brakeMode: 'linear' };
        const DEFAULT_BG_OPACITY = 70;         // % — SimHub "Background opacity"
        const DEFAULT_VALUE_BG_OPACITY = 100;  // % — SimHub "Background opacity (speed / throttle / brake)"
        let gameUsesMph = false;      // Session m_speedUnitsLeadPlayer (0 = MPH, 1 = KPH)
        let isMph = null;
        let lastSpeedKmh = 0;
        let isSpectating = 0;
        let spectatorCarIndex = 255;

        // Active car's DRS / Overtake Mode inputs (pid 6, 7 and 16)
        const car = {
            drs: 0, drsAllowed: 0, drsDistance: 0,       // DRS: open / can open now / metres to activation
            otActive: 0, otAvailable: 0, otDistance: 0,   // Overtake Mode: usable / earned / metres to activation
            ersMode: 0,
            regs2026: false,                              // only pid 16 (2026 format) can set this
        };
        let renderedIndicator = null;

        // ── Gauges ─────────────────────────────────────────────────────────
        const gauges = ['speed', 'throttle', 'brake'].map(name => {
            const canvas = document.getElementById(`spd-gauge-${name}`);
            const gauge = { name, canvas, ctx: canvas.getContext('2d'), image: new Image(), from: 0, to: 0, current: 0, target: 0, drawn: null };
            gauge.image.onload = () => drawGauge(gauge);
            return gauge;
        });
        const gauge = Object.fromEntries(gauges.map(g => [g.name, g]));

        // Canvas backing store at 2x (or the screen's pixel ratio) so the arcs stay sharp
        // when the overlay is scaled up.
        function resizeGauge(g) {
            const res = Math.max(2, window.devicePixelRatio || 1);
            g.canvas.width = Math.round(g.canvas.offsetWidth * res);
            g.canvas.height = Math.round(g.canvas.offsetHeight * res);
        }

        function drawGauge(g) {
            const { ctx, canvas, image } = g;
            const w = canvas.width, h = canvas.height;
            ctx.clearRect(0, 0, w, h);
            g.drawn = g.current;
            if (g.current <= 0 || !image.complete || !image.naturalWidth) return;

            const cx = w / 2, cy = h / 2;
            const start = g.from * Math.PI / 180;
            const end = (g.from + (g.to - g.from) * g.current) * Math.PI / 180;
            ctx.save();
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, Math.min(cx, cy), start, end, g.to < g.from);
            ctx.closePath();
            ctx.clip();
            ctx.drawImage(image, 0, 0, w, h);
            ctx.restore();
        }

        // One animation loop for all three gauges: each frame moves every gauge part of the
        // way to its latest target, and the loop stops itself once they've all settled.
        let frameId = null;
        let lastFrameTime = 0;

        function setGaugeTarget(g, value) {
            g.target = Math.min(Math.max(Number(value) || 0, 0), 1);
            if (g.target !== g.current && frameId === null) frameId = requestAnimationFrame(animateGauges);
        }

        function animateGauges(now) {
            const dt = lastFrameTime ? Math.min(now - lastFrameTime, 100) : 16;
            lastFrameTime = now;
            const step = 1 - Math.exp(-dt / SMOOTHING_MS);
            let moving = false;

            for (const g of gauges) {
                const diff = g.target - g.current;
                if (Math.abs(diff) < 0.001) {
                    g.current = g.target;
                } else {
                    g.current += diff * step;
                    moving = true;
                }
                if (g.current !== g.drawn) drawGauge(g);
            }

            if (moving) {
                frameId = requestAnimationFrame(animateGauges);
            } else {
                frameId = null;
                lastFrameTime = 0;
            }
        }

        // ── Design ─────────────────────────────────────────────────────────
        function applyDesign(mode) {
            if (!DESIGNS[mode]) mode = 'f1tv';
            if (mode === config.designMode) return;
            config.designMode = mode;
            const design = DESIGNS[mode];

            overlayContainer.classList.toggle('design-f1tv', mode === 'f1tv');
            overlayContainer.classList.toggle('design-multiviewer', mode === 'multiviewer');
            backgroundImage.src = design.background;
            valueBackgroundImage.src = design.valueBackground;

            for (const g of gauges) {
                const spec = design.gauges[g.name];
                g.from = spec.from;
                g.to = spec.to;
                resizeGauge(g);       // canvas size comes from the design's CSS
                g.image.src = spec.image;
                drawGauge(g);         // redrawn again by image.onload if it wasn't cached
            }
        }

        // ── Units ──────────────────────────────────────────────────────────
        function applyUnits() {
            const mph = config.unitsMode === 'mph' || (config.unitsMode !== 'kmh' && gameUsesMph);
            if (mph === isMph) return;
            isMph = mph;
            unitsText.textContent = mph ? 'MPH' : 'KMH';
            unitsImage.src = mph ? UNITS_IMAGES.mph : UNITS_IMAGES.kmh;
            renderSpeed();
        }

        function renderSpeed() {
            const speed = isMph ? Math.round(lastSpeedKmh * KMH_TO_MPH) : lastSpeedKmh;
            setText(speedText, speed);
            setGaugeTarget(gauge.speed, speed / (isMph ? GAUGE_MAX_SPEED.mph : GAUGE_MAX_SPEED.kmh));
        }

        function setText(el, value) {
            const text = String(value);
            if (el.textContent !== text) el.textContent = text;
        }

        // ── DRS / Overtake Mode indicator ──────────────────────────────────
        // Four tiers, the same for both mechanics:
        //   off       → grey label, no outline
        //   pending   → white label (+ white outline in Multiviewer): approaching the activation
        //               point, or Overtake Mode earned but not usable yet
        //   available → blinking outline: DRS can be opened / Overtake Mode is usable
        //   active    → filled: DRS open / Overtake Mode used with Boost ERS
        // From the recordings: m_drsAllowed drops back to 0 once DRS opens, and m_overtakeActive
        // stays on from the activation line until the next detection point.
        function indicatorTier() {
            if (car.regs2026) {
                if (car.otActive === 1) return car.ersMode === ERS_MODE_BOOST ? 'active' : 'available';
                if (car.otDistance > 0 || car.otAvailable === 1) return 'pending';
                return 'off';
            }
            if (car.drs === 1) return 'active';
            if (car.drsAllowed === 1) return 'available';
            if (car.drsDistance > 0) return 'pending';
            return 'off';
        }

        function renderIndicator() {
            const tier = indicatorTier();
            const key = `${car.regs2026}|${tier}`;
            if (key === renderedIndicator) return;
            renderedIndicator = key;

            const images = car.regs2026 ? INDICATOR_IMAGES.overtake : INDICATOR_IMAGES.drs;
            overlayContainer.dataset.tier = tier;
            overlayContainer.classList.toggle('is-overtake', car.regs2026);
            indicatorLabel.textContent = car.regs2026 ? 'OT' : 'DRS';
            indicatorBase.src = tier === 'active' ? images.active : images.base;
            indicatorBorder.src = images.border;
        }

        // Config percentage (0-100) → CSS opacity (0-1); anything invalid falls back to the default
        function opacityPercent(value, fallback) {
            const pct = Number.isFinite(value) && value >= 0 && value <= 100 ? value : fallback;
            return String(pct / 100);
        }

        // ── Socket ─────────────────────────────────────────────────────────
        socket.on('overlay_config', (cfg) => {
            const speedometerConfig = cfg?.overlays?.['speedometer'];
            if (!speedometerConfig) return;

            overlayContainer.classList.toggle('visible', !!speedometerConfig.visible);
            applyDesign(speedometerConfig.designMode || 'f1tv');
            config.unitsMode = speedometerConfig.unitsMode || 'automatic';
            applyUnits();
            config.brakeMode = speedometerConfig.brakeMode === 'onoff' ? 'onoff' : 'linear';
            overlayContainer.style.setProperty('--spd-bg-opacity', opacityPercent(speedometerConfig.backgroundOpacity, DEFAULT_BG_OPACITY));
            overlayContainer.style.setProperty('--spd-value-bg-opacity', opacityPercent(speedometerConfig.valueBackgroundOpacity, DEFAULT_VALUE_BG_OPACITY));
        });

        socket.on('f1_data', (data) => {
            const pid = data?.m_header?.m_packetId;
            const rawPlayerIndex = data?.m_header?.m_playerCarIndex ?? 0;
            const playerIndex = DriverUtils.getActiveDriverIndex(rawPlayerIndex, isSpectating, spectatorCarIndex);

            if (pid === 1) { // Session
                isSpectating = data.m_isSpectating ?? isSpectating;
                spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;
                if (typeof data.m_speedUnitsLeadPlayer === 'number') {
                    gameUsesMph = data.m_speedUnitsLeadPlayer === 0;
                    applyUnits();
                }
            } else if (pid === 6) { // Car Telemetry
                const t = data.m_carTelemetryData?.[playerIndex];
                if (!t) return;

                lastSpeedKmh = t.m_speed ?? 0;
                renderSpeed();
                setText(rpmText, t.m_engineRPM ?? 0);
                setText(gearText, t.m_gear === -1 ? 'R' : t.m_gear > 0 ? t.m_gear : 'N');
                setGaugeTarget(gauge.throttle, t.m_throttle);
                // On/Off hides brake pressure, like the TV graphics: any braking fills the whole arc
                setGaugeTarget(gauge.brake, config.brakeMode === 'onoff' ? (t.m_brake > 0 ? 1 : 0) : t.m_brake);

                car.drs = t.m_drs ?? 0;
                renderIndicator();
            } else if (pid === 7) { // Car Status
                const s = data.m_carStatusData?.[playerIndex];
                if (!s) return;

                car.drsAllowed = s.m_drsAllowed ?? 0;
                car.drsDistance = s.m_drsActivationDistance ?? 0;
                car.ersMode = s.m_ersDeployMode ?? 0;
                renderIndicator();
            } else if (pid === 16) { // Car Telemetry 2 (2026 Season Pack format only)
                const t2 = data.m_carTelemetry2Data?.[playerIndex];
                if (!t2) return;

                car.regs2026 = t2.m_2026Regulations === 1;
                car.otActive = t2.m_overtakeActive ?? 0;
                car.otAvailable = t2.m_overtakeAvailable ?? 0;
                car.otDistance = t2.m_overtakeActivationDistance ?? 0;
                renderIndicator();
            }
        });

        // ── Init ───────────────────────────────────────────────────────────
        applyDesign('f1tv');
        applyUnits();
        renderIndicator();
    </script>
</body>
</html>
