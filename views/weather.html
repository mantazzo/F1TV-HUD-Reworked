<!DOCTYPE html>
<html>
<head>
    <title>F1 Weather Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-weather.css">
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="/utils/driver-utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="weather-container">
        <!-- Top Header: CURRENT CONDITIONS -->
        <div class="header-section">
            <div class="header-bg"></div>
            <div class="header-text">
                <div class="header-current">CURRENT</div>
                <div class="header-conditions">CONDITIONS</div>
            </div>
        </div>
        
        <!-- Content wrapper for current weather + forecast (animated together) -->
        <div class="weather-content">
            <!-- Covers the placeholder values below until the first real Session
                 packet arrives; fades out once actual weather data is received -->
            <div class="weather-waiting" id="weather-waiting">
                <span>NO DATA</span>
            </div>

            <!-- Current Weather Section -->
            <div class="current-weather-section">
                <div class="section-bg"></div>
                
                <!-- Gradient decoration at top -->
                <div class="section-gradient"></div>
                
                <!-- Air Temperature -->
                <div class="air-temp-row">
                    <div class="temp-label">AIR TEMP</div>
                    <div class="temp-line air-line"></div>
                </div>
                
                <!-- Weather Icon + Air Temperatures -->
                <div class="air-temp-values">
                    <div class="weather-icon-large" id="current-weather-icon"></div>
                    <div class="temp-celsius">
                        <span class="temp-value-main" id="air-temp-primary">--</span>
                        <span class="temp-unit" id="air-unit-primary">°C</span>
                    </div>
                    <div class="temp-fahrenheit">
                        <span class="temp-value-secondary" id="air-temp-secondary">--</span>
                        <span class="temp-unit-secondary" id="air-unit-secondary">°F</span>
                    </div>
                </div>
                
                <!-- Track Temperature -->
                <div class="track-temp-row">
                    <div class="temp-label">TRACK TEMP</div>
                    <div class="temp-line track-line"></div>
                </div>
                
                <!-- Track Icon + Track Temperatures -->
                <div class="track-temp-values">
                    <div class="track-icon"></div>
                    <div class="temp-celsius">
                        <span class="temp-value-main" id="track-temp-primary">--</span>
                        <span class="temp-unit" id="track-unit-primary">°C</span>
                    </div>
                    <div class="temp-fahrenheit">
                        <span class="temp-value-secondary" id="track-temp-secondary">--</span>
                        <span class="temp-unit-secondary" id="track-unit-secondary">°F</span>
                    </div>
                </div>
            </div>
            
            <!-- Forecast Section -->
            <div class="forecast-section">
                <div class="section-bg"></div>
                
                <!-- Gradient decoration at top -->
                <div class="section-gradient forecast-gradient"></div>
                
                <!-- Forecast Header -->
                <div class="forecast-header-row">
                    <div class="forecast-label">FORECAST</div>
                    <div class="forecast-session" id="forecast-session"></div>
                    <div class="forecast-line"></div>
                </div>
                
                <!-- Forecast Row 1: +5m -->
                <div class="forecast-row" id="forecast-row-1">
                    <div class="forecast-icon" id="forecast-icon-1"></div>
                    <div class="forecast-info">
                        <div class="forecast-condition" id="forecast-condition-1">--</div>
                        <div class="forecast-time">+5m</div>
                    </div>
                    <div class="forecast-chance" id="forecast-chance-1">--%</div>
                    <div class="forecast-divider"></div>
                </div>
                
                <!-- Forecast Row 2: +10m -->
                <div class="forecast-row" id="forecast-row-2">
                    <div class="forecast-icon" id="forecast-icon-2"></div>
                    <div class="forecast-info">
                        <div class="forecast-condition" id="forecast-condition-2">--</div>
                        <div class="forecast-time">+10m</div>
                    </div>
                    <div class="forecast-chance" id="forecast-chance-2">--%</div>
                    <div class="forecast-divider"></div>
                </div>
                
                <!-- Forecast Row 3: +15m -->
                <div class="forecast-row" id="forecast-row-3">
                    <div class="forecast-icon" id="forecast-icon-3"></div>
                    <div class="forecast-info">
                        <div class="forecast-condition" id="forecast-condition-3">--</div>
                        <div class="forecast-time">+15m</div>
                    </div>
                    <div class="forecast-chance" id="forecast-chance-3">--%</div>
                    <div class="forecast-divider"></div>
                </div>
                
                <!-- Forecast Row 4: +30m -->
                <div class="forecast-row" id="forecast-row-4">
                    <div class="forecast-icon" id="forecast-icon-4"></div>
                    <div class="forecast-info">
                        <div class="forecast-condition" id="forecast-condition-4">--</div>
                        <div class="forecast-time">+30m</div>
                    </div>
                    <div class="forecast-chance" id="forecast-chance-4">--%</div>
                </div>
            </div>
        </div><!-- End weather-content wrapper -->
    </div>
    
    <script>
        const socket = io();
        socket.emit('identify', 'Weather');
        
        const weatherContainer = document.querySelector('.weather-container');
        const forecastSection = document.querySelector('.forecast-section');
        const weatherContent = document.querySelector('.weather-content');

        // Tracks whether a real Session packet has arrived yet — the "NO DATA"
        // cover stays up over the placeholder values until it does.
        let hasReceivedWeatherData = false;

        // ── Formation Lap auto-display ──────────────────────────────────────────
        // Original SimHub formula: show for WeatherAutoDurationTime (12s) once the car has
        // covered more than 10% of the lap during Formation Lap (m_safetyCarStatus === 3).
        // Uses the race leader's lap distance (same reference the Leaderboard's
        // Standings-on-Formation-Lap uses). Auto can only force the overlay visible — the
        // manual toggle still decides visibility the rest of the time.
        const FORMATION_AUTO_THRESHOLD = 0.10;
        const FORMATION_AUTO_DURATION_MS = 12000;
        let manualVisible = false;
        let autoFormationLap = false;
        let formationLap = false;
        let sessionTrackLength = 0;
        let formationAutoFired = false;   // latch: fire only once per Formation Lap
        let formationAutoActive = false;
        let formationAutoTimer = null;

        function applyVisibility() {
            weatherContainer.classList.toggle('visible', manualVisible || formationAutoActive);
        }

        function cancelFormationAuto() {
            if (formationAutoTimer) {
                clearTimeout(formationAutoTimer);
                formationAutoTimer = null;
            }
            formationAutoActive = false;
        }

        function checkFormationAuto(lapData) {
            if (!autoFormationLap || !formationLap || formationAutoFired || sessionTrackLength <= 0) return;
            const leader = lapData.find(car => car.m_carPosition === 1);
            if (!leader) return;
            const pct = (leader.m_lapDistance ?? 0) / sessionTrackLength;
            if (pct <= FORMATION_AUTO_THRESHOLD) return;

            formationAutoFired = true;
            formationAutoActive = true;
            applyVisibility();
            formationAutoTimer = setTimeout(() => {
                formationAutoTimer = null;
                formationAutoActive = false;
                applyVisibility();
            }, FORMATION_AUTO_DURATION_MS);
        }

        // Handle overlay visibility from controller with animation
        socket.on('overlay_config', (config) => {
            if (config.overlays && config.overlays['weather']) {
                const weatherConfig = config.overlays['weather'];

                // Main weather visibility - use .visible class (starts hidden by default)
                manualVisible = weatherConfig.visible === true;
                autoFormationLap = weatherConfig.autoFormationLap === true;
                if (!autoFormationLap) cancelFormationAuto();
                applyVisibility();
                
                // Forecast rotation + which session's forecast to show
                const newRotate = weatherConfig.rotateForecast === true;
                const newSession = Number(weatherConfig.forecastSession) || 0;
                if (newSession !== selectedForecastSession) {
                    swapForecast(() => {
                        selectedForecastSession = newSession;
                        forecastPage = 0;
                    });
                    restartForecastRotation();
                }
                if (newRotate !== rotateForecast) {
                    rotateForecast = newRotate;
                    forecastPage = 0;
                    renderForecast();
                    restartForecastRotation();
                }

                // Forecast visibility (only matters if weather is visible)
                if (weatherConfig.showForecast !== false) {
                    forecastSection.classList.remove('hidden');
                } else {
                    forecastSection.classList.add('hidden');
                }
                
                // Temperature units mode
                if (weatherConfig.temperatureUnitsMode !== undefined) {
                    const newMode = weatherConfig.temperatureUnitsMode;
                    if (newMode !== temperatureUnitsMode) {
                        temperatureUnitsMode = newMode;
                        
                        // Apply manual temperature unit override if set
                        if (temperatureUnitsMode === 'celsius') {
                            temperatureUnits = 0;
                            updateCurrentWeather(currentAirTemp, currentTrackTemp, currentWeatherId);
                        } else if (temperatureUnitsMode === 'fahrenheit') {
                            temperatureUnits = 1;
                            updateCurrentWeather(currentAirTemp, currentTrackTemp, currentWeatherId);
                        }
                        // If 'automatic', will be handled by session packet
                    }
                }
            }
        });
        
        // Weather conditions - will be populated from server
        let weatherNames = ['Clear', 'Light Cloud', 'Overcast', 'Light Rain', 'Heavy Rain', 'Storm'];
        
        // Weather icon mapping (day versions)
        const WEATHER_ICONS = {
            0: 'clear.png',
            1: 'light_cloud.png',
            2: 'overcast.png',
            3: 'light_rain.png',
            4: 'heavy_rain.png',
            5: 'storm.png'
        };
        
        // Weather icons that have night variants (weather ID -> night icon filename)
        const WEATHER_ICONS_NIGHT = {
            0: 'clear_night.png',
            1: 'light_cloud_night.png',
            3: 'light_rain_night.png'
        };
        
        // Night time detection (true if between 20:00 and 06:00)
        let isNightTime = false;
        
        // Element references
        const airTempPrimary = document.getElementById('air-temp-primary');
        const airTempSecondary = document.getElementById('air-temp-secondary');
        const airUnitPrimary = document.getElementById('air-unit-primary');
        const airUnitSecondary = document.getElementById('air-unit-secondary');
        const trackTempPrimary = document.getElementById('track-temp-primary');
        const trackTempSecondary = document.getElementById('track-temp-secondary');
        const trackUnitPrimary = document.getElementById('track-unit-primary');
        const trackUnitSecondary = document.getElementById('track-unit-secondary');
        const currentWeatherIcon = document.getElementById('current-weather-icon');
        
        // Temperature unit preference: 0 = Celsius primary, 1 = Fahrenheit primary
        let temperatureUnits = 0;
        // Temperature units mode: 'automatic', 'celsius', 'fahrenheit'
        let temperatureUnitsMode = 'automatic';
        
        // Store current temperatures for re-display when units change
        let currentAirTemp = 22;
        let currentTrackTemp = 35;
        let currentWeatherId = 0;
        
        // Store forecast weather IDs for refreshing icons on day/night change
        let forecastWeatherIds = [0, 0, 0, 0];
        
        // Forecast elements
        const forecastRows = [1, 2, 3, 4].map(i => ({
            row: document.getElementById(`forecast-row-${i}`),
            icon: document.getElementById(`forecast-icon-${i}`),
            condition: document.getElementById(`forecast-condition-${i}`),
            chance: document.getElementById(`forecast-chance-${i}`),
            time: document.querySelector(`#forecast-row-${i} .forecast-time`)
        }));
        
        // Convert Celsius to Fahrenheit
        function celsiusToFahrenheit(celsius) {
            return Math.round((celsius * 9/5) + 32);
        }
        
        // Set weather icon (uses night variant if available and it's night time)
        function setWeatherIcon(element, weatherId) {
            let icon;
            if (isNightTime && WEATHER_ICONS_NIGHT[weatherId]) {
                icon = WEATHER_ICONS_NIGHT[weatherId];
            } else {
                icon = WEATHER_ICONS[weatherId] || WEATHER_ICONS[0];
            }
            element.style.backgroundImage = `url('/images/weather/${icon}')`;
        }
        
        // Check if time of day is night (between 20:00/8PM and 06:00/6AM)
        // timeOfDay is in minutes since midnight
        function checkNightTime(timeOfDay) {
            const NIGHT_START = 20 * 60;  // 20:00 = 1200 minutes
            const NIGHT_END = 6 * 60;     // 06:00 = 360 minutes
            return timeOfDay >= NIGHT_START || timeOfDay < NIGHT_END;
        }
        
        // Get weather condition name
        function getWeatherName(weatherId) {
            const name = weatherNames[weatherId] || weatherNames[0];
            return name.toUpperCase();
        }
        
        // Update current weather display based on temperature unit preference
        function updateCurrentWeather(airTemp, trackTemp, weatherId) {
            currentAirTemp = airTemp;
            currentTrackTemp = trackTemp;
            currentWeatherId = weatherId;
            
            // Temps are already integers (int8 from UDP), only Fahrenheit conversion needs rounding
            const airF = celsiusToFahrenheit(airTemp);
            const trackF = celsiusToFahrenheit(trackTemp);
            
            if (temperatureUnits === 0) {
                // Celsius primary
                airTempPrimary.textContent = airTemp;
                airTempSecondary.textContent = airF;
                airUnitPrimary.textContent = '°C';
                airUnitSecondary.textContent = '°F';
                trackTempPrimary.textContent = trackTemp;
                trackTempSecondary.textContent = trackF;
                trackUnitPrimary.textContent = '°C';
                trackUnitSecondary.textContent = '°F';
            } else {
                // Fahrenheit primary
                airTempPrimary.textContent = airF;
                airTempSecondary.textContent = airTemp;
                airUnitPrimary.textContent = '°F';
                airUnitSecondary.textContent = '°C';
                trackTempPrimary.textContent = trackF;
                trackTempSecondary.textContent = trackTemp;
                trackUnitPrimary.textContent = '°F';
                trackUnitSecondary.textContent = '°C';
            }
            
            setWeatherIcon(currentWeatherIcon, weatherId);
        }
        
        // Update forecast row with dynamic font sizing using textFit
        function updateForecastRow(index, weatherId, rainChance) {
            const row = forecastRows[index];
            if (row) {
                // Store weather ID for refreshing on day/night change
                forecastWeatherIds[index] = weatherId;
                
                setWeatherIcon(row.icon, weatherId);
                const weatherName = getWeatherName(weatherId);
                row.condition.textContent = weatherName;
                
                // Use textFit to auto-resize font to fit container
                // detectMultiLine must be forced off: textFit's own heuristic measures wrap BEFORE
                // applying nowrap, so a two-word name like "Light Rain" wraps at the default font
                // size, gets misdetected as intentionally multi-line, and silently overrides our
                // multiLine:false — skipping both the nowrap and the font-shrink entirely.
                textFit(row.condition, {
                    minFontSize: 14,
                    maxFontSize: 20,
                    multiLine: false,
                    detectMultiLine: false,
                    alignHoriz: true,
                    alignVert: false,
                    widthOnly: true
                });
                
                row.chance.textContent = `${Math.round(rainChance)}%`;
            }
        }
        
        // ── Forecast: session selection + rotation ──────────────────────────────
        // The sample buffer holds the current session plus every remaining session of the
        // weekend (m_weekendStructure order — finished sessions drop out), and offsets differ
        // per session type (Practice 5-60, Qualifying only 5-20, Race 5-120).
        const FORECAST_ROTATE_MS = 10000;
        const FORECAST_FADE_MS = 250;
        const forecastSessionEl = document.getElementById('forecast-session');
        let forecastData = null;           // last Session packet's forecast (see pid 1 handler)
        let rotateForecast = false;        // controller: rotate through more than 4 offsets
        let selectedForecastSession = 0;   // controller: 0 = current session, else a session type
        let forecastPage = 0;
        let forecastSwapping = false;
        let forecastRotateTimer = null;

        // Session whose forecast is shown: the controller's pick, unless that's the current
        // session or it's no longer in the buffer (already finished) — then the current one.
        function getForecastSessionType() {
            if (!forecastData) return null;
            const { samples, sessionType } = forecastData;
            if (selectedForecastSession && selectedForecastSession !== sessionType &&
                samples.some(s => s.m_sessionType === selectedForecastSession)) {
                return selectedForecastSession;
            }
            return sessionType;
        }

        // Future offsets of the shown session, split into pages of 4 rows. A short last page is
        // back-filled from the one before (Practice: +5..+30, then +15..+60) so no row is blank.
        function getForecastPages() {
            const target = getForecastSessionType();
            if (target === null) return [];
            const entries = forecastData.samples
                .filter(s => s.m_sessionType === target && s.m_timeOffset > 0)
                .sort((a, b) => a.m_timeOffset - b.m_timeOffset);
            if (entries.length <= 4) return [entries];
            const pages = [];
            for (let i = 0; i < entries.length; i += 4) {
                pages.push(i + 4 <= entries.length ? entries.slice(i, i + 4) : entries.slice(-4));
            }
            return pages;
        }

        function renderForecast() {
            if (!forecastData || forecastSwapping) return;
            const pages = getForecastPages();
            if (!rotateForecast || forecastPage >= pages.length) forecastPage = 0;
            const page = pages[forecastPage] ?? [];

            // Header only names the session when it isn't the current one
            const target = getForecastSessionType();
            forecastSessionEl.textContent = target !== forecastData.sessionType
                ? DriverUtils.getSessionShortName(target, forecastData.weekendStructure, forecastData.formulaType)
                : '';

            forecastRows.forEach((row, index) => {
                const sample = page[index];
                if (sample) {
                    row.time.textContent = `+${sample.m_timeOffset}m`;
                    updateForecastRow(index, sample.m_weather, sample.m_rainPercentage);
                } else {
                    // No sample for this row — don't leave another session's forecast showing
                    row.time.textContent = '--';
                    row.condition.textContent = '--';
                    row.chance.textContent = '--%';
                }
            });
        }

        // Fade the rows out, apply the change, re-render, fade back in
        function swapForecast(change) {
            if (forecastSwapping) { change(); return; }  // pending swap will render it
            forecastSwapping = true;
            forecastSection.classList.add('swapping');
            setTimeout(() => {
                change();
                forecastSwapping = false;
                renderForecast();
                forecastSection.classList.remove('swapping');
            }, FORECAST_FADE_MS);
        }

        // (Re)start the 10s page cycle — restarted on session/rotation changes so a fresh
        // selection always gets its full 10 seconds on the first page
        function restartForecastRotation() {
            clearInterval(forecastRotateTimer);
            forecastRotateTimer = setInterval(() => {
                if (!rotateForecast || forecastSwapping) return;
                if (getForecastPages().length > 1) swapForecast(() => forecastPage++);
            }, FORECAST_ROTATE_MS);
        }
        restartForecastRotation();

        // Refresh all weather icons (used when day/night changes)
        function refreshAllWeatherIcons() {
            setWeatherIcon(currentWeatherIcon, currentWeatherId);
            forecastRows.forEach((row, index) => {
                setWeatherIcon(row.icon, forecastWeatherIds[index]);
            });
        }
        
        // Socket.IO event handlers
        socket.on('weather_data', (data) => {
            if (Array.isArray(data)) {
                weatherNames = data;
                console.log('[Weather] Weather names loaded from server:', weatherNames);
            }
        });
        
        socket.on('f1_data', (data) => {
            try {
                const packetId = data?.m_header?.m_packetId;
                
                if (packetId === 1) {
                    // Session packet - contains weather data

                    // Formation Lap state for auto-display. Leaving Formation Lap ends any
                    // active auto-display (formula also requires m_safetyCarStatus === 3)
                    // and re-arms the latch for the next one.
                    if (typeof data.m_trackLength === 'number') sessionTrackLength = data.m_trackLength;
                    const isFormationLap = data.m_safetyCarStatus === 3;
                    if (formationLap && !isFormationLap) {
                        formationAutoFired = false;
                        if (formationAutoActive) {
                            cancelFormationAuto();
                            applyVisibility();
                        }
                    }
                    formationLap = isFormationLap;

                    // Check for time of day change (for night icons)
                    if (typeof data.m_timeOfDay === 'number') {
                        const wasNight = isNightTime;
                        isNightTime = checkNightTime(data.m_timeOfDay);
                        if (wasNight !== isNightTime) {
                            console.log('[Weather] Time period changed to:', isNightTime ? 'Night' : 'Day', `(${Math.floor(data.m_timeOfDay / 60)}:${String(data.m_timeOfDay % 60).padStart(2, '0')})`);
                            // Refresh all icons with correct day/night variants
                            refreshAllWeatherIcons();
                        }
                    }
                    
                    // Check for temperature unit preference change (only in automatic mode)
                    if (temperatureUnitsMode === 'automatic' && typeof data.m_temperatureUnitsLeadPlayer === 'number') {
                        const newUnits = data.m_temperatureUnitsLeadPlayer;
                        if (newUnits !== temperatureUnits) {
                            temperatureUnits = newUnits;
                            console.log('[Weather] Temperature units changed to:', temperatureUnits === 0 ? 'Celsius' : 'Fahrenheit');
                            // Re-display with updated units
                            updateCurrentWeather(currentAirTemp, currentTrackTemp, currentWeatherId);
                        }
                    }
                    
                    const airTemp = data.m_airTemperature;
                    const trackTemp = data.m_trackTemperature;
                    const weather = data.m_weather;
                    
                    if (airTemp !== undefined && trackTemp !== undefined) {
                        updateCurrentWeather(airTemp, trackTemp, weather);

                        if (!hasReceivedWeatherData) {
                            hasReceivedWeatherData = true;
                            weatherContent.classList.add('data-received');
                        }
                    }
                    
                    // Forecast data (if available) — cached so config changes (rotation,
                    // selected session) can re-render without waiting for the next packet
                    if (Array.isArray(data.m_weatherForecastSamples)) {
                        const numSamples = data.m_numWeatherForecastSamples ?? data.m_weatherForecastSamples.length;
                        forecastData = {
                            samples: data.m_weatherForecastSamples.slice(0, numSamples),
                            sessionType: data.m_sessionType,
                            weekendStructure: data.m_weekendStructure ?? [],
                            formulaType: data.m_formula ?? 0
                        };
                        renderForecast();
                    }
                } else if (packetId === 2) {
                    // Lap Data - only used for the Formation Lap auto-display trigger
                    if (Array.isArray(data.m_lapData)) checkFormationAuto(data.m_lapData);
                }
            } catch (error) {
                console.error('[Weather] Error processing data:', error);
            }
        });
        
        // Set initial weather icon (clear)
        setWeatherIcon(currentWeatherIcon, 0);
        forecastRows.forEach((row, index) => {
            setWeatherIcon(row.icon, 0);
        });
        
        console.log('[Weather] Overlay initialized');
    </script>
</body>
</html>
