<!DOCTYPE html>
<html>
<head>
    <title>F1 Pit Timer Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-pit-timer.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/textfit@2.4.0/textFit.min.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="overlay-container">
        <!-- Header Section -->
        <div class="header-section">
            <div class="pit-lane-text">PIT LANE</div>
            <div class="header-line"></div>
        </div>

        <!-- Data Display (driver + timer sections; expands downwards when shown) -->
        <div class="data-section">
            <!-- Driver Info Section -->
            <div class="driver-section">
                <div class="driver-background"></div>
                <div class="position-layer">1</div>
                <div class="team-logo-layer"></div>
                <div class="driver-name-layer">DRIVER</div>
            </div>

            <!-- Pit Timer Section -->
            <div class="timer-section">
                <div class="timer-background"></div>

                <!-- Stop Time Value -->
                <div class="stop-time-value">0.0</div>

                <!-- Stop Time Display -->
                <div class="stop-time-container">
                    <div class="stop-label">STOP</div>
                    <div class="time-label">TIME</div>
                </div>

                <!-- Pit Time Display -->
                <div class="pit-time-container">
                    <div class="pit-label">PIT</div>
                    <div class="pit-time-value">0.0</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        socket.emit('identify', 'Pit Timer');

        // Element references
        const overlayContainer = document.querySelector('.overlay-container');
        const positionElement = document.querySelector('.position-layer');
        const teamLogoElement = document.querySelector('.team-logo-layer');
        const driverNameElement = document.querySelector('.driver-name-layer');
        const pitTimeValue = document.querySelector('.pit-time-value');
        const stopTimeValue = document.querySelector('.stop-time-value');
        const stopTimeContainer = document.querySelector('.stop-time-container');
        const pitTimeContainer = document.querySelector('.pit-time-container');

        // Timings from the original SimHub formulas (isdecreasing / changed delays)
        const EXIT_HOLD_MS = 4000;      // header + data display stay up this long after the pit exit line
        const EXIT_CENTER_MS = 6000;    // pit-time widget sits centred (showing the final lane time) this long after exit
        const STOP_HOLD_MS = 4000;      // STOP TIME labels stay up this long after the stop timer stops counting

        // State variables
        let position = 0;
        let driverName = '';
        let teamId = 0;
        let primaryColor = null;
        let inPit = false;           // m_pitLaneTimerActive — pit entry → pit exit line, races only
        let laneTimeMs = 0;          // m_pitLaneTimeInLaneInMS (live)
        let stopTimeMs = 0;          // m_pitStopTimerInMS — counts in the box, holds its final value until pit exit
        let lastLaneTimeMs = 0;      // last non-zero lane time — the game resets it to 0 at the exit line
        let stopChangedAt = 0;       // when the stop timer last changed (while > 0)
        let exitedAt = -Infinity;    // when we last crossed the pit exit line
        let isSpectating = 0;     // from Session packet m_isSpectating
        let spectatorCarIndex = 255; // from Session packet m_spectatorCarIndex

        // Team and driver data
        let teamNames = {};
        let driversData = {};
        let customDrivers = [];
        let formulaType = DriverUtils.FORMULA_TYPE.F1_MODERN;
        let useTeamColor = true;

        // Load driver data using DriverUtils
        async function loadDriverData() {
            try {
                const data = await DriverUtils.loadDriverData(formulaType);
                customDrivers = data.customDrivers;
                teamNames = data.teamNames;
                console.debug('[PitTimer] Loaded driver data:', customDrivers.length, 'custom drivers');
            } catch (error) {
                console.error('[PitTimer] Error loading driver data:', error);
            }
        }

        // Update team logo image + background color. Background matches the team color —
        // same OverridePrimaryColor → livery priority (and useTeamColor gate) already
        // established by updateStopTimeColor() below, falling back to the original static
        // navy plate when Team Color display is off, and to transparent when no colour is
        // known yet. Logo_Alt takes priority over Logo, matching the Leaderboard/Fastest
        // Sectors treatment — some logos would otherwise blend into a same-color background.
        // Reads teamId/primaryColor from module state rather than taking parameters, same
        // idiom as updateStopTimeColor().
        function updateTeamLogo() {
            const teamData = teamNames[teamId];
            const logoFile = teamData?.Logo_Alt ?? teamData?.Logo ?? null;
            const bgColor = !useTeamColor
                ? '#081425FF'
                : (teamData?.OverridePrimaryColor || primaryColor || 'transparent');

            if (logoFile) {
                const logoPath = `/images/team-logos/${logoFile}`;
                const img = new Image();

                img.onload = () => {
                    teamLogoElement.style.backgroundColor = bgColor;
                    teamLogoElement.style.backgroundImage = `url(${logoPath})`;
                };

                img.onerror = () => {
                    teamLogoElement.style.backgroundColor = 'transparent';
                    teamLogoElement.style.backgroundImage = 'none';
                };

                img.src = logoPath;
            } else {
                teamLogoElement.style.backgroundColor = 'transparent';
                teamLogoElement.style.backgroundImage = 'none';
            }
        }

        // Update stop time color: team colour (override → livery) when enabled, otherwise white
        function updateStopTimeColor() {
            if (!stopTimeValue) return;

            // If team color is disabled, use white
            if (!useTeamColor) {
                stopTimeValue.style.color = '#ffffff';
                return;
            }

            // Check if team has override color
            if (teamId !== null && teamNames && teamNames[teamId] && teamNames[teamId].OverridePrimaryColor) {
                const overrideColor = teamNames[teamId].OverridePrimaryColor;
                stopTimeValue.style.color = overrideColor;
                console.debug('[PitTimer] Using override color:', overrideColor);
            } else if (primaryColor) {
                // Use livery color from game
                stopTimeValue.style.color = primaryColor;
                console.debug('[PitTimer] Using livery color:', primaryColor);
            } else {
                // No team colour known yet — default white
                stopTimeValue.style.color = '#ffffff';
            }
        }

        // Update driver name + styling using textFit (only called when the name changes)
        function updateDriverName(name) {
            driverNameElement.textContent = name;

            // Apply font-weight and font-stretch based on name length
            if (name.length <= 10) {
                driverNameElement.style.fontWeight = "700";
                driverNameElement.style.fontStretch = "normal";
            } else {
                driverNameElement.style.fontWeight = "400";
                driverNameElement.style.fontStretch = "condensed";
            }

            // Use textFit to auto-resize font to fit container
            textFit(driverNameElement, {
                minFontSize: 20,
                maxFontSize: 26,
                multiLine: false,
                detectMultiLine: false,
                alignHoriz: true,
                alignVert: false,
                widthOnly: true
            });
        }

        // Apply the current pit state to the display. Called on every Lap Data packet and on a
        // short interval, so the time-based holds still end if packets stop arriving.
        function render() {
            const now = Date.now();
            const sinceExit = now - exitedAt;

            // SimHub: isdecreasing(2000, inPit) or inPit — header + data display
            overlayContainer.classList.toggle('is-active', inPit || sinceExit < EXIT_HOLD_MS);

            // SimHub: changed(4000, stopTimer>0, stopTimer) — the stop timer is counting, or stopped
            // less than 4s ago. While true: STOP TIME labels shown, pit-time widget hidden.
            // (The stop timer resets to 0 at the exit line, so this always ends there.)
            const stopPhase = inPit && stopTimeMs > 0 && (now - stopChangedAt) < STOP_HOLD_MS;
            stopTimeContainer.style.opacity = stopPhase ? '1' : '0';
            pitTimeContainer.style.opacity = stopPhase ? '0' : '1';

            // SimHub: isdecreasing(6000, inPit) — after the exit line the widget slides to the centre
            // and shows the final lane time (LastPitStopDuration); otherwise it's the live lane timer
            const centered = !inPit && sinceExit < EXIT_CENTER_MS;
            pitTimeContainer.classList.toggle('is-centered', centered);
            // (final time gets the full millisecond precision, the live one ticks in tenths;
            // 100s+ drops to hundredths — "128.078" is ~1.5px wider than the 155px widget)
            pitTimeValue.textContent = centered
                ? (lastLaneTimeMs / 1000).toFixed(lastLaneTimeMs >= 100000 ? 2 : 3)
                : (laneTimeMs / 1000).toFixed(1);

            // Stop time value: visible while the stop timer is > 0, smaller font past 9.9s
            const stopText = (stopTimeMs / 1000).toFixed(1);
            stopTimeValue.style.opacity = stopTimeMs > 0 ? '1' : '0';
            if (stopTimeMs > 0) {
                stopTimeValue.textContent = stopText + ' ';
                stopTimeValue.style.fontSize = parseFloat(stopText) > 9.9 ? '60px' : '80px';
            }
        }

        // Socket.IO event handlers
        socket.on('drivers_data', (drivers) => {
            driversData = drivers;
            console.debug('[PitTimer] Received drivers data:', Object.keys(driversData).length, 'drivers');
        });

        // Handle overlay config updates
        socket.on('overlay_config', (config) => {
            if (config.overlays && config.overlays['pit-timer']) {
                const pitTimerConfig = config.overlays['pit-timer'];
                
                // Update team color setting
                if (pitTimerConfig.useTeamColor !== undefined) {
                    useTeamColor = pitTimerConfig.useTeamColor;
                    console.debug('[PitTimer] Team color setting updated:', useTeamColor);

                    // Refresh stop time color and team logo background with new setting
                    updateStopTimeColor();
                    updateTeamLogo();
                }
            }
        });

        socket.on('f1_data', (data) => {
            try {
                const rawPlayerIdx = data?.m_header?.m_playerCarIndex;
                const playerIdx = DriverUtils.getActiveDriverIndex(rawPlayerIdx, isSpectating, spectatorCarIndex);

                // Session packet - track formula type + spectating state
                if (data?.m_header?.m_packetId === 1) {
                    isSpectating      = data.m_isSpectating      ?? isSpectating;
                    spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;

                    if (typeof data.m_formula === 'number' && data.m_formula !== formulaType) {
                        formulaType = data.m_formula;
                        console.debug('[PitTimer] Formula type:', formulaType);
                        loadDriverData();
                    }
                }

                if (data?.m_header?.m_packetId === 2) { // Lap Data
                    const lapData = Array.isArray(data.m_lapData) ? data.m_lapData[playerIdx] : undefined;
                    if (lapData) {
                        // Update position
                        if (typeof lapData.m_carPosition === 'number' && lapData.m_carPosition !== position) {
                            position = lapData.m_carPosition;
                            positionElement.textContent = position > 0 ? position : '-';
                        }

                        // In pit lane: m_pitLaneTimerActive is only set during races, which is what this
                        // overlay is for. It flips together with m_pitStatus at the entry and exit lines.
                        const newInPit = lapData.m_pitLaneTimerActive === 1;
                        if (inPit && !newInPit) {
                            // Crossed the exit line — the game zeroes both timers here, so the final
                            // lane time is the last non-zero value we saw
                            exitedAt = Date.now();
                            console.debug('[PitTimer] Left pit lane - final pit time:', (lastLaneTimeMs / 1000).toFixed(1));
                        }
                        inPit = newInPit;

                        laneTimeMs = lapData.m_pitLaneTimeInLaneInMS > 0 ? lapData.m_pitLaneTimeInLaneInMS : 0;
                        if (inPit && laneTimeMs > 0) lastLaneTimeMs = laneTimeMs;

                        const newStopTimeMs = lapData.m_pitStopTimerInMS > 0 ? lapData.m_pitStopTimerInMS : 0;
                        if (newStopTimeMs > 0 && newStopTimeMs !== stopTimeMs) stopChangedAt = Date.now();
                        stopTimeMs = newStopTimeMs;

                        render();
                    }
                }

                if (data?.m_header?.m_packetId === 4) { // Participants
                    const participantData = Array.isArray(data.m_participants) ? data.m_participants[playerIdx] : undefined;
                    if (participantData) {
                        // Get primary livery color and convert to hex
                        if (participantData.m_liveryColour && Array.isArray(participantData.m_liveryColour) && participantData.m_liveryColour.length > 0) {
                            const liveryColor = participantData.m_liveryColour[0];
                            if (liveryColor && typeof liveryColor.red === 'number' && typeof liveryColor.green === 'number' && typeof liveryColor.blue === 'number') {
                                const hexColor = `#${liveryColor.red.toString(16).padStart(2, '0')}${liveryColor.green.toString(16).padStart(2, '0')}${liveryColor.blue.toString(16).padStart(2, '0')}`;
                                primaryColor = hexColor;
                                updateStopTimeColor();
                            }
                        }
                        
                        // Update team ID
                        if (typeof participantData.m_teamId === 'number') {
                            const newTeamId = participantData.m_teamId;
                            if (newTeamId !== teamId) {
                                teamId = newTeamId;
                                console.debug('[PitTimer] Packet 4 received. playerIdx:', playerIdx, 'teamId:', teamId);
                                updateTeamLogo();
                                updateStopTimeColor();
                            }
                        }

                        // Update driver name using DriverUtils
                        const newName = DriverUtils.getDriverLastName(
                            participantData,
                            driversData,
                            customDrivers,
                            teamNames
                        );
                        
                        if (newName && newName !== driverName) {
                            driverName = newName;
                            console.debug('[PitTimer] Driver name updated:', driverName);
                            updateDriverName(driverName.toUpperCase());
                        }
                    }
                }
            } catch (e) {
                console.warn('[PitTimer] Error handling f1_data:', e);
            }
        });

        // Initialize
        loadDriverData();
        render(); // Start hidden (will show when entering pit lane during race)
        setInterval(render, 100);
    </script>
</body>
</html>
