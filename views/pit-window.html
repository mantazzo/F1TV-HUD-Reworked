<!DOCTYPE html>
<html>
<head>
    <title>F1 Pit Window Overlay</title>
    <link rel="stylesheet" href="/fonts.css">
    <link rel="stylesheet" href="/styles-tauri-overlay.css">
    <link rel="stylesheet" href="/styles-pit-window.css">
    <script src="/utils/preload.js"></script>
    <script>AssetPreloader.preloadAll();</script>
    <script src="/socket.io/socket.io.js"></script>
    <script src="/utils/overlay-scale.js"></script>
    <script src="/utils/driver-utils.js"></script>
</head>
<body data-tauri-drag-region>
    <div class="overlay-container">
        <!-- AWS Banner (first, so it hides behind the background when slid up) -->
        <div class="aws-banner">
            <div class="aws-background"></div>
            <div class="aws-text"></div>
        </div>

        <!-- Background -->
        <div class="pw-background"></div>
        
        <!-- Compound Section -->
        <div class="compound-section">
            <div class="compound-oval"></div>
            <div class="compound-name">NO DATA</div>
            <div class="compound-decoration"></div>
        </div>
        
        <!-- Current Tyre Labels -->
        <div class="current-label">CURRENT</div>
        <div class="tyre-label">TYRE</div>
        
        <!-- Pit Window Section -->
        <div class="pit-window-section">
            <div class="pit-window-background"></div>
            <div class="pit-window-borders">
                <div class="border-top-right"></div>
                <div class="border-bottom-left"></div>
            </div>
            <div class="pit-window-label">PIT WINDOW</div>
            <div class="pit-window-content">
                <div class="lap-label">LAP</div>
                <div class="lap-values">N/A</div>
            </div>
        </div>
        
        <!-- Top Gradient -->
        <div class="top-gradient"></div>
    </div>
    
    <script>
        const socket = io();
        socket.emit('identify', 'Pit Window');
        
        const overlayContainer = document.querySelector('.overlay-container');
        const compoundOval = document.querySelector('.compound-oval');
        const compoundName = document.querySelector('.compound-name');
        const compoundDecoration = document.querySelector('.compound-decoration');
        const lapLabel = document.querySelector('.lap-label');
        const lapValues = document.querySelector('.lap-values');
        const borderTopRight = document.querySelector('.border-top-right');
        const borderBottomLeft = document.querySelector('.border-bottom-left');
        const pitWindowLabel = document.querySelector('.pit-window-label');
        const pitWindowContent = document.querySelector('.pit-window-content');
        const awsBanner = document.querySelector('.aws-banner');

        // State variables
        let currentCompound = null;
        let pitWindowIdeal = 0;
        let pitWindowLatest = 0;
        let currentLap = 0;
        let sessionType = null;   // from Session packet m_sessionType
        let playerIndex = null;  // "active driver" — m_header.m_playerCarIndex, or m_spectatorCarIndex while spectating
        let rawPlayerIndex = null; // from m_header.m_playerCarIndex, unmodified
        let isSpectating = 0;     // from Session packet m_isSpectating
        let spectatorCarIndex = 255; // from Session packet m_spectatorCarIndex
        
        // Auto display configuration
        let autoDisplayEnabled = false;
        let autoMode = 'none';
        let autoDuration = 15000; // Defaults to 15 seconds, set from the Controller's "Display Duration" (autoDuration in OverlayConfig.json)
        let autoHideTimer = null;
        let lastAutoShowLap = -1; // Track which lap triggered auto-show to avoid repeated triggers
        let previousVisibility = false; // Track previous visibility state
        let previousAutoDisplay = false; // Track previous auto display state

        // Sponsor display control
        const BANNER_DURATION = 10000; // SimHub: isincreasing(10000, ...)
        let bannerTimer = null;
        let showSponsors = true; // global (all overlays): AWS banner

        // Visual tyre compounds, same IDs and colors as the Leaderboards. There's no oval image
        // for Super Soft, that one is drawn in CSS (.is-supersoft)
        const TYRE_COMPOUND = {
            7:  { displayText: 'INTER', color: '#31AF49', image: '/images/pit-window/Inter.png' },
            8:  { displayText: 'WET', color: '#0073AD', image: '/images/pit-window/Wet.png' },
            15: { displayText: 'WET', color: '#0073AD', image: '/images/pit-window/Wet.png' }, // F2
            16: { displayText: 'SOFT', color: '#EC1C24', image: '/images/pit-window/Soft.png' },
            17: { displayText: 'MEDIUM', color: '#FFD604', image: '/images/pit-window/Medium.png' },
            18: { displayText: 'HARD', color: '#F0F0EC', image: '/images/pit-window/Hard.png' },
            19: { displayText: 'SUPER SOFT', color: '#97528F', image: null }, // F2
            20: { displayText: 'SOFT', color: '#EC1C24', image: '/images/pit-window/Soft.png' }, // F2
            21: { displayText: 'MEDIUM', color: '#FFD604', image: '/images/pit-window/Medium.png' }, // F2
            22: { displayText: 'HARD', color: '#F0F0EC', image: '/images/pit-window/Hard.png' } // F2
        };
        const NO_COMPOUND = { displayText: 'NO DATA', color: '#EBD25F', image: '/images/pit-window/Medium.png' };

        // SimHub: BlinkEnabled isincreasing(800, ...), BlinkDelay 150 (see .blink-active)
        function blinkPitWindow() {
            pitWindowContent.classList.remove('blink-active');
            void pitWindowContent.offsetWidth; // Force reflow
            pitWindowContent.classList.add('blink-active');
        }

        // SimHub: the banner slides down from behind the background for the first 10 seconds
        // after the overlay is shown (if sponsor logos are on), then slides back up
        function startBanner() {
            clearTimeout(bannerTimer);
            if (!showSponsors) return;
            awsBanner.classList.add('is-shown');
            bannerTimer = setTimeout(hideBanner, BANNER_DURATION);
        }

        function hideBanner() {
            clearTimeout(bannerTimer);
            bannerTimer = null;
            awsBanner.classList.remove('is-shown');
        }

        // Helper function to show overlay with animation
        function showOverlay() {
            overlayContainer.classList.add('visible');
            blinkPitWindow();
            startBanner();
        }

        // Helper function to hide overlay
        function hideOverlay() {
            overlayContainer.classList.remove('visible');
            hideBanner();
            clearAutoHideTimer();
        }

        // Pit stops only happen in races. Before the first Session packet the session isn't known
        // yet, so the overlay can still be shown then (e.g. to position it without the game running)
        function isPitWindowSession() {
            const T = DriverUtils.SESSION_TYPE;
            return sessionType === null || sessionType === T.RACE || sessionType === T.RACE_2 || sessionType === T.RACE_3;
        }

        // Show the overlay as switched on in the Controller, if this session allows it
        function showFromController() {
            if (!isPitWindowSession()) return;
            showOverlay();

            // If auto display is enabled, start auto-hide timer. previousVisibility stays
            // true after it hides, so that changing settings doesn't re-trigger the overlay
            if (autoDisplayEnabled) startAutoHideTimer();
        }

        function clearAutoHideTimer() {
            if (autoHideTimer) {
                clearTimeout(autoHideTimer);
                autoHideTimer = null;
            }
        }

        function startAutoHideTimer() {
            clearAutoHideTimer();
            autoHideTimer = setTimeout(hideOverlay, autoDuration);
        }
        
        // Handle overlay visibility from controller
        socket.on('overlay_config', (config) => {
            showSponsors = config.global?.showSponsors !== false;
            if (!showSponsors) hideBanner();

            if (config.overlays && config.overlays['pit-window']) {
                const pitWindowConfig = config.overlays['pit-window'];
                
                // Update auto display settings
                const newAutoDisplay = pitWindowConfig.autoDisplay === true;
                autoMode = pitWindowConfig.autoMode || 'none';
                autoDuration = pitWindowConfig.autoDuration || 15000;
                
                // Handle manual visibility toggle - only trigger show/hide if visibility actually changed
                const newVisibility = pitWindowConfig.visible === true;
                autoDisplayEnabled = newAutoDisplay;
                
                if (newVisibility !== previousVisibility) {
                    previousVisibility = newVisibility;
                    
                    if (newVisibility) {
                        showFromController();
                    } else {
                        hideOverlay();
                    }
                }
                // Handle edge case: auto display was switched while overlay is shown from the Controller
                else if (newAutoDisplay !== previousAutoDisplay && previousVisibility === true) {
                    if (newAutoDisplay) startAutoHideTimer(); else clearAutoHideTimer();
                }
                
                // Update auto display state tracking
                previousAutoDisplay = newAutoDisplay;
            }
        });
        
        // Update compound display
        function updateCompound(visualCompound) {
            const compound = TYRE_COMPOUND[visualCompound] || NO_COMPOUND;

            if (currentCompound !== compound) {
                currentCompound = compound;

                // Update text
                compoundName.textContent = compound.displayText;

                // Update oval background image
                compoundOval.style.backgroundImage = compound.image ? `url('${compound.image}')` : '';
                compoundOval.classList.toggle('is-supersoft', !compound.image);
                compoundName.classList.toggle('is-supersoft', !compound.image);

                // Get color for this compound
                const compoundColor = compound.color;

                // Update decoration border color
                compoundDecoration.style.borderColor = compoundColor;
                
                // Update pit window borders
                borderTopRight.style.borderColor = compoundColor;
                borderBottomLeft.style.borderColor = compoundColor;
                
                // Update pit window label color
                pitWindowLabel.style.color = compoundColor;
                
                // Update lap values color
                lapValues.style.color = compoundColor;
                
                console.log('[PitWindow] Compound updated:', compound.displayText, 'Color:', compoundColor);
            }
        }
        
        // Update pit window display
        function updatePitWindow(idealLap, latestLap) {
            // SimHub: Left if(ideal>9,30,45) - a shorter lap range leaves more room for the label
            lapLabel.classList.toggle('is-single-digit', idealLap <= 9);

            if (idealLap === 0 && latestLap === 0) {
                lapValues.textContent = 'N/A';
            } else {
                const windowJustOpened = lapValues.textContent === 'N/A';
                lapValues.textContent = `${idealLap}-${latestLap}`;

                // SimHub's blink only follows the overlay appearing, which here includes the
                // window arriving while it's already on screen as "N/A"
                if (windowJustOpened && overlayContainer.classList.contains('visible')) {
                    blinkPitWindow();
                }
            }
        }

        // Automatic Mode: pop up on the configured lap(s). Runs on a lap change and on a pit window
        // change, since the window can move mid-lap (SimHub's changed() reacts to both)
        function checkAutoShow() {
            if (!autoDisplayEnabled || !isPitWindowSession() || pitWindowIdeal <= 0 || currentLap <= 0) return;
            if (lastAutoShowLap === currentLap) return;

            const isLapBefore = currentLap === pitWindowIdeal - 1;
            const isWindowLap = currentLap === pitWindowIdeal;
            const shouldShow = (autoMode === 'idealLap-1' && isLapBefore)
                || (autoMode === 'idealLap' && isWindowLap)
                || (autoMode === 'both' && (isLapBefore || isWindowLap));

            if (shouldShow) {
                lastAutoShowLap = currentLap;
                showOverlay();
                startAutoHideTimer();
            }
        }
        
        // Handle F1 data packets
        socket.on('f1_data', (data) => {
            const packetId = data.m_header.m_packetId;
            
            if (packetId === 1) {
                // Session packet - pit window data + spectating state
                isSpectating      = data.m_isSpectating      ?? isSpectating;
                spectatorCarIndex = data.m_spectatorCarIndex ?? spectatorCarIndex;
                playerIndex = DriverUtils.getActiveDriverIndex(rawPlayerIndex, isSpectating, spectatorCarIndex);

                const wasPitWindowSession = isPitWindowSession();
                sessionType = data.m_sessionType ?? sessionType;

                const idealLap = data.m_pitStopWindowIdealLap || 0;
                const latestLap = data.m_pitStopWindowLatestLap || 0;

                if (pitWindowIdeal !== idealLap || pitWindowLatest !== latestLap) {
                    pitWindowIdeal = idealLap;
                    pitWindowLatest = latestLap;
                    updatePitWindow(idealLap, latestLap);
                    checkAutoShow();
                }

                // Entering or leaving a race
                if (isPitWindowSession() !== wasPitWindowSession) {
                    if (!isPitWindowSession()) hideOverlay();
                    else if (previousVisibility) showFromController();
                }
            } else if (packetId === 2) {
                // Lap Data packet - track player's current lap
                rawPlayerIndex = data.m_header.m_playerCarIndex ?? rawPlayerIndex;
                playerIndex = DriverUtils.getActiveDriverIndex(rawPlayerIndex, isSpectating, spectatorCarIndex);

                if (data.m_lapData && data.m_lapData[playerIndex]) {
                    const newLap = data.m_lapData[playerIndex].m_currentLapNum || 0;
                    
                    // Only process if lap changed
                    if (newLap !== currentLap && newLap > 0) {
                        // Lap went backwards (new race, flashback) - the same lap can trigger again
                        if (newLap < currentLap) lastAutoShowLap = -1;
                        currentLap = newLap;
                        checkAutoShow();
                    }
                }
            } else if (packetId === 7) {
                // Car Status packet - get player's tyre compound
                if (data.m_carStatusData && data.m_carStatusData[playerIndex]) {
                    const visualCompound = data.m_carStatusData[playerIndex].m_visualTyreCompound;
                    updateCompound(visualCompound);
                }
            }
        });
        
        // Initialize with placeholder
        updatePitWindow(0, 0);
        // Set default compound oval image (Medium) for visibility, text will remain "NO DATA"
        compoundOval.style.backgroundImage = "url('/images/pit-window/Medium.png')";
    </script>
</body>
</html>
